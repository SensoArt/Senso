<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso - Journal</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        @font-face { 
            font-family: 'FuturaLight'; 
            src: url('Fonts/futura light bt.ttf') format('truetype'); 
            font-display: swap; 
        }
        @font-face { 
            font-family: 'BehindNineties'; 
            src: url('Fonts/Behind-The-Nineties-Md-It.otf') format('opentype'); 
            font-display: swap; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        body { 
            background-color: #fff; 
            color: #000; 
            margin: 0; 
            padding: 0; 
            font-family: 'FuturaLight', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-color: #fff;
        }

        .back-home { 
            position: fixed; 
            top: 30px; 
            left: 30px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.6; 
            z-index: 1000; 
            transition: opacity 0.3s; 
        }

        .back-home:hover { opacity: 1; }

        .lang-switch { 
            position: fixed; 
            top: 30px; 
            right: 30px; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            z-index: 1000; 
        }

        .lang-btn { 
            background: none; 
            border: none; 
            color: #000; 
            cursor: pointer; 
            padding: 0 5px; 
            opacity: 0.3; 
            text-transform: uppercase; 
            font-family: inherit; 
            letter-spacing: inherit; 
            transition: opacity 0.3s; 
        }

        .lang-btn.active { opacity: 1; }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 160px 25px 120px; 
        }

        .journal-header {
            margin-bottom: 70px;
            text-align: left;
        }

        .journal-title { 
            font-family: 'BehindNineties', serif; 
            font-size: clamp(2.5rem, 6vw, 3.8rem); 
            font-weight: normal;
            font-style: italic;
            text-transform: lowercase;
            margin: 0; 
            display: inline-block;
            overflow: visible;
            padding-left: 0.35em;
            padding-right: 0.15em;
            padding-bottom: 0.25em;
            margin-left: -0.32em;
            line-height: 1.4;
        }

        .journal-feed {
            display: flex;
            flex-direction: column;
        }

        .essay-card {
            border-bottom: 1px solid rgba(0, 0, 0, 0.12);
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .essay-card:hover {
            opacity: 0.65;
        }

        .essay-number {
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            color: #000;
        }

        .essay-title {
            font-family: 'FuturaLight', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.7rem);
            font-weight: normal;
            margin: 0 0 15px 0;
            line-height: 1.25;
            letter-spacing: 0.2px;
            color: #000;
        }

        .essay-subtype {
            font-family: 'BehindNineties', serif;
            font-size: 1.05rem;
            color: #000;
            opacity: 0.85;
            margin: 0;
        }

        .hidden { display: none !important; }

        @media (max-width: 800px) {
            .container { padding-top: 120px; }
            .back-home { top: 25px; left: 20px; }
            .lang-switch { top: 25px; right: 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="lang-switch">
        <button onclick="setLang('en')" id="btn-en" class="lang-btn">EN</button> | 
        <button onclick="setLang('es')" id="btn-es" class="lang-btn">ES</button> |
        <button onclick="setLang('it')" id="btn-it" class="lang-btn">IT</button>
    </div>

    <div class="container">

        <header class="journal-header fade-in delay-1">
            <h1 class="journal-title">journal</h1>
        </header>

        <main class="journal-feed fade-in delay-2">

            <a href="on-opening.html" class="essay-card">
                <span class="essay-number">Journal 001</span>
                <h2 class="essay-title">On Opening an Independent Gallery</h2>
                <span class="essay-subtype lang-en">Essay - July 2026</span>
                <span class="essay-subtype lang-es hidden">Ensayo - Julio 2026</span>
                <span class="essay-subtype lang-it hidden">Saggio - Luglio 2026</span>
            </a>

            <a href="the-need-for-beauty.html" class="essay-card">
                <span class="essay-number">Journal 002</span>
                
                <!-- Titolo Tradotto -->
                <h2 class="essay-title lang-en">The Need for Beauty</h2>
                <h2 class="essay-title lang-es hidden">La Necesidad de la Belleza</h2>
                <h2 class="essay-title lang-it hidden">Il Bisogno di Bellezza</h2>

                <!-- Sottotitolo / Data -->
                <span class="essay-subtype lang-en">August 2026</span>
                <span class="essay-subtype lang-es hidden">Agosto 2026</span>
                <span class="essay-subtype lang-it hidden">Agosto 2026</span>
            </a>

        </main>
    </div>

    <script>
        let currentLang = localStorage.getItem('senso_lang') || 'it';

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('senso_lang', lang);

            // Aggiorna lo stato dei bottoni
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');

            // Mostra/Nascondi tutti gli elementi con classi multilingua (sia titoli che sottotitoli)
            document.querySelectorAll('.lang-en, .lang-es, .lang-it').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll(`.lang-${lang}`).forEach(el => el.classList.remove('hidden'));
        }

        window.onload = function() {
            setLang(currentLang);
        }
    </script>
</body>
</html>
