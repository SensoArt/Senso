<!DOCTYPE html>
<html lang="en">
<head>

        <img

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Senso - Contacts</title>

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon.png?v=1000"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="favicon.png?v=1000"
    >

    <link
        rel="apple-touch-icon"
        href="favicon.png?v=1000"
    >

    <style>

        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .delay-1 {
            animation-delay: 0.3s;
        }

        .delay-2 {
            animation-delay: 0.8s;
        }

        .delay-3 {
            animation-delay: 1.3s;
        }

        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'FuturaLight', sans-serif;
            -webkit-font-smoothing: antialiased;
            text-align: center;
            overflow-x: hidden;
        }

        .back-home {
            position: fixed;
            top: 25px;
            left: 20px;
            text-decoration: none;
            color: #fff;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 2px;
            opacity: 0.5;
            z-index: 1000;
            transition: 0.3s;
        }

        .back-home:hover {
            opacity: 1;
        }

        /* SOCIAL / CONTACT ICONS */

        .contact-links {
            margin-bottom: 60px;
            margin-top: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .contact-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            color: #fff;
            text-decoration: none;
            opacity: 0.65;
            transition: opacity 0.3s, transform 0.3s;
        }

        .contact-links a:hover {
            opacity: 1;
            transform: translateY(-1px);
        }

        .contact-links svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        .contact-links .mail-icon,
        .contact-links .instagram-icon {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .contact-links .linkedin-icon {
            fill: currentColor;
        }

        .newsletter-box {
            max-width: 500px;
            width: 85%;
            border-top: 1px solid #1a1a1a;
            padding-top: 50px;
            margin-bottom: 60px;
            position: relative;
            min-height: 250px;
        }

        .newsletter-box p {
            font-size: 1rem;
            letter-spacing: 1.5px;
            margin-bottom: 35px;
            opacity: 0.9;
            line-height: 1.8;
        }

        /* Gestione stati Form e Successo */

        #form-content {
            transition: opacity 0.8s ease;
        }

        #success-message {
            display: none;
            opacity: 0;
            transition: opacity 1.2s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            padding: 40px 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            padding: 10px 5px;
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .submit-btn {
            background: none;
            border: 1px solid #333;
            color: #fff;
            padding: 14px;
            margin-top: 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.65rem;
            transition: 0.4s;
        }

        .submit-btn:hover:not(:disabled) {
            background: #fff;
            color: #000;
        }

        .submit-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-family: 'FuturaLight', sans-serif;
            text-transform: uppercase;
            font-size: 0.55rem;
            letter-spacing: 3px;
            opacity: 0.4;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 30px;
            padding: 10px;
        }

        .back-btn:hover {
            opacity: 1;
        }

        @media (max-width: 600px) {

            .newsletter-box p {
                font-size: 0.95rem;
            }

        }

    </style>

</head>

<body>

    <a href="index.html" class="back-home">
        ← Home
    </a>

    <div class="contact-links fade-in delay-1">

        <!-- EMAIL -->
        <a
            href="mailto:contact@senso-art.com"
            aria-label="Email Senso"
        >
            <svg
                class="mail-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="1"
                ></rect>

                <path d="M3 6l9 7 9-7"></path>
            </svg>
        </a>

        <!-- INSTAGRAM -->
        <a
            href="https://www.instagram.com/senso_art_/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Senso on Instagram"
        >
            <svg
                class="instagram-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <rect
                    x="3.5"
                    y="3.5"
                    width="17"
                    height="17"
                    rx="5"
                ></rect>

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                ></circle>

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="0.8"
                    fill="currentColor"
                    stroke="none"
                ></circle>
            </svg>
        </a>

        <!-- LINKEDIN -->
        <a
            href="https://www.linkedin.com/company/sensoartbarcelona"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Senso on LinkedIn"
        >
            <svg
                class="linkedin-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V8.99h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.61 0 4.28 2.38 4.28 5.48v6.27ZM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM3.54 20.45H7.1V8.99H3.54v11.46Z"></path>
            </svg>
        </a>

    </div>

    <div
        id="newsletter-container"
        class="newsletter-box fade-in delay-2"
    >

        <div id="form-content">

            <p>
                Get updates on artists, exhibitions, and events.
            </p>

            <form
                action="https://formspree.io/f/mgorwree"
                method="POST"
                class="form-group"
                id="contact-form"
            >

                <input
                    type="text"
                    name="first_name"
                    placeholder="First Name"
                    required
                >

                <input
                    type="text"
                    name="last_name"
                    placeholder="Last Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <button
                    type="submit"
                    class="submit-btn"
                    id="submit-btn"
                >
                    Subscribe
                </button>

            </form>

        </div>

        <div id="success-message">

            <p>
                Your request has been received.<br>
                Thank you.
            </p>

            <button
                type="button"
                class="back-btn"
                onclick="resetForm()"
            >
                BACK
            </button>

        </div>

    </div>

    <script>

        const form =
            document.getElementById('contact-form');

        const formContent =
            document.getElementById('form-content');

        const successMessage =
            document.getElementById('success-message');

        const btn =
            document.getElementById('submit-btn');


        form.onsubmit = async (e) => {

            e.preventDefault();

            btn.innerText = "SENDING...";
            btn.disabled = true;

            const formData =
                new FormData(form);

            try {

                const response =
                    await fetch(
                        form.action,
                        {
                            method: 'POST',
                            body: formData,
                            headers: {
                                'Accept':
                                    'application/json'
                            }
                        }
                    );

                if (response.ok) {

                    formContent.style.opacity = "0";

                    setTimeout(() => {

                        formContent.style.display =
                            "none";

                        successMessage.style.display =
                            "block";

                        setTimeout(() => {

                            successMessage.style.opacity =
                                "1";

                        }, 50);

                    }, 800);

                } else {

                    btn.innerText =
                        "ERROR. TRY AGAIN.";

                    btn.disabled = false;

                }

            } catch (error) {

                btn.innerText =
                    "CONNECTION ERROR.";

                btn.disabled = false;

            }

        };


        function resetForm() {

            successMessage.style.opacity = "0";

            setTimeout(() => {

                successMessage.style.display =
                    "none";

                formContent.style.display =
                    "block";

                form.reset();

                btn.innerText =
                    "SUBSCRIBE";

                btn.disabled =
                    false;

                setTimeout(() => {

                    formContent.style.opacity =
                        "1";

                }, 50);

            }, 800);

        }

    </script>

</body>
</html>
