<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; 
            background-color: #000; 
            color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; 
            height: 100vh;
        }

        /* SFONDO CON PROFONDITÀ INIZIALE */
        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            /* Leggero blur e scurimento per separare il piano */
            filter: brightness(0.6) blur(1px);
            transition: all 1.5s cubic-bezier(0.15, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1); /* Zoom per parallasse */
        }

        /* FIX TASTO HOME */
        .back-home {
            position: fixed;
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #fff !important;
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.6;
            z-index: 9999;
            transition: opacity 0.3s;
            display: block;
        }
        .back-home:visited { color: #fff !important; }
        .back-home:hover { opacity: 1; }

        /* CONTENUTO */
        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 18vh; 
            padding-left: 10%;
        }

        .project-link {
            text-decoration: none !important;
            display: inline-block;
            position: relative;
            padding: 40px;
            z-index: 100;
        }

        /* 1. PROFONDITÀ PRIMA DELL'HOVER: ALONE DI LUCE SOFFUSO */
        .project-link::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 140%; height: 140%;
            /* Radial gradient per un alone morbido e profondo */
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 40%, rgba(255,255,255,0) 70%);
            transform: translate(-50%, -50%) scale(1);
            opacity: 1; /* Sempre visibile per dare profondità */
            transition: all 1s ease;
            pointer-events: none;
            z-index: -1;
        }

        /* 2. PROFONDITÀ PRIMA DELL'HOVER: TEXT-SHADOW MASSICCIO */
        .project-title { 
            font-size: 2.2rem; 
            letter-spacing: 12px; 
            text-transform: uppercase; 
            margin: 0; 
            /* COLORE INIZIALE: Grigio Scuro / Effetto "Scavato" */
            color: #1a1a1a !important; 
            /* Ombra scura e molto staccata per simulare levitazione */
            text-shadow: 0 15px 40px rgba(0, 0, 0, 0.9); 
            transition: all 0.8s cubic-bezier(0.15, 1, 0.3, 1);
            opacity: 1;
            position: relative;
        }

        .project-date { 
            font-size: 0.65rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-top: 15px; 
            color: #666; /* Grigio medio iniziale */
            opacity: 1;
            transition: all 0.6s ease;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
        }

        /* --- EFFETTI AL PASSAGGIO DEL CURSORE --- */
        
        /* Lo sfondo diventa nitido */
        body:has(.project-link:hover) .archive-bg {
            filter: brightness(0.8) blur(0px);
            transform: scale(1.05);
        }

        /* L'alone si espande */
        .project-link:hover::before {
            opacity: 0.8;
            transform: translate(-50%, -50%) scale(1.15);
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 70%);
        }

        /* Il testo si "accende" e si alza */
        .project-link:hover .project-title {
            color: #fff !important; /* CAMBIO COLORE: Bianco Puro */
            letter-spacing: 16px;
            transform: translateY(-8px);
            /* L'ombra si stacca ancora di più */
            text-shadow: 0 30px 60px rgba(0, 0, 0, 1);
        }

        .project-link:hover .project-date {
            color: #fff; /* Data diventa bianca */
            transform: translateY(2px);
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 25vh; padding-left: 0; justify-content: center; }
            .project-title { font-size: 1.6rem; letter-spacing: 8px; }
            .project-link:hover .project-title { letter-spacing: 11px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
