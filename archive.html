<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    <link rel="icon" type="image/png" href="favicon.png?v=3">
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO PAGINA */
        .archive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-image: url('archive_background_final.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.25;
        }

        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; opacity: 0.5; z-index: 10;
        }

        /* POSIZIONAMENTO CONTENUTO */
        .archive-content {
            position: absolute;
            top: 150px;
            left: 50px;
            z-index: 5;
            text-align: left;
        }

        .project-link {
            text-decoration: none;
            color: #fff;
            display: inline-block;
        }

        /* IMMAGINE CAOS CON BORDI SFUMATI */
        .project-image {
            width: 420px; /* Leggermente più grande per vederla meglio */
            height: auto;
            display: block;
            margin-bottom: 25px;
            opacity: 0.8; /* Più visibile, meno trasparente */
            
            /* SFUMATURA MORBIDA SU TUTTI I BORDI */
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 95%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 95%);
            
            transition: opacity 0.3s ease;
        }

        .project-link:hover .project-image {
            opacity: 1; /* Si illumina al passaggio del mouse */
        }

        .project-title { 
            font-size: 1.35rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0; 
            font-weight: normal;
        }

        .project-date { 
            font-size: 0.6rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.4; 
            margin-top: 8px; 
        }

    </style>
</head>
<body>

    <div class="archive-bg"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <img src="caos.jpg" class="project-image" alt="Principium">
            
            <h2 class="project-title">Principium</h2>
            <p class="project-date">Chapter I — Barcelona, 2024</p>
        </a>
    </div>

</body>
</html>
