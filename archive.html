<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=1000">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        /* Reset totale per bloccare lo scroll */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
        }

        /* Sfondo con la tua immagine */
        .archive-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
        }

        .archive-bg img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0.35; filter: grayscale(100%);
        }
        
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* Link per tornare Home */
        .back-home {
            position: absolute; top: 25px; left: 20px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; opacity: 0.5; transition: 0.3s;
        }
        .back-home:hover { opacity: 1; }

        /* Posizionamento a sinistra del progetto */
        .archive-content {
            position: absolute;
            bottom: 100px; /* Alzo un po' dal fondo */
            left: 40px;    /* Allineato a sinistra */
            text-align: left;
        }

        .project-link {
            text-decoration: none;
            color: #fff;
            display: inline-block;
            transition: 0.3s;
        }

        .project-link:hover { opacity: 0.6; }

        .project-title {
            font-size: 1.1rem; /* Piccolino ed elegante */
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
        }

        .project-date {
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.4;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .archive-content { left: 25px; bottom: 60px; }
            .project-title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_bg.jpg" alt="Background">
    </div>
    
    <div class="bg-overlay"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <h2 class="project-title">Principium</h2>
            <p class="project-date">Chapter I — Barcelona, 2024</p>
        </a>
    </div>

</body>
</html>
