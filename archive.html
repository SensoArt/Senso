<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1000">
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO */
        .archive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-image: url('archive_bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.45;
        }
        
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        /* HOME - Allineata al contenuto */
        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; opacity: 0.5; z-index: 10;
            transition: 0.3s;
        }
        .back-home:hover { opacity: 1; }

        /* CONTENUTO - Spostato più a destra */
        .archive-content {
            position: absolute;
            top: 140px; 
            left: 50px; /* Aumentato il distacco dal bordo */
            text-align: left;
            z-index: 5;
        }

        .project-link { text-decoration: none; color: #fff; display: inline-block; transition: 0.3s; }
        .project-link:hover { opacity: 0.6; }

        .project-title { 
            font-size: 1.3rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0; 
            font-weight: normal;
        }

        .project-date { 
            font-size: 0.6rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.4; 
            margin-top: 8px; 
        }

    </style>
</head>
<body>

    <div class="archive-bg"></div>
    <div class="bg-overlay"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <h2 class="project-title">Principium</h2>
            <p class="project-date">Chapter I — Barcelona, 2024</p>
        </a>
    </div>

</body>
</html>
