<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; 
            background-color: #000; 
            color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; 
            height: 100vh;
        }

        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.7);
            transition: all 1.5s cubic-bezier(0.15, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1);
        }

        .back-home {
            position: fixed;
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000 !important; /* Nero per eleganza su sfondo chiaro */
            text-transform: uppercase;
            font-size: 0.6rem; 
            letter-spacing: 2px; 
            opacity: 0.5;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        .back-home:visited { color: #000 !important; }
        .back-home:hover { opacity: 1; }

        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 15vh; 
            padding-left: 10%;
        }

        /* EFFETTO GOCCIA / LENTE */
        .project-link {
            text-decoration: none !important;
            display: inline-block;
            position: relative;
            padding: 50px 60px;
            z-index: 100;
            transition: transform 0.8s cubic-bezier(0.15, 1, 0.3, 1);
        }

        /* La "Goccia" di vetro dietro il testo */
        .project-link::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 110%; height: 110%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px) saturate(1.2); /* Effetto lente */
            -webkit-backdrop-filter: blur(8px) saturate(1.2);
            border-radius: 50%; /* Forma a goccia/lente soffusa */
            transform: translate(-50%, -50%) scale(0.9);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05), 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0.6;
            transition: all 0.8s ease;
            pointer-events: none;
            z-index: -1;
        }

        .project-link:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
            border-radius: 40%; /* Si espande dolcemente */
        }

        .project-title { 
            font-size: 1.8rem; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #000 !important; /* Nero profondo */
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); 
            transition: all 0.8s ease;
        }

        .project-date { 
            font-size: 0.55rem; /* Più piccolo e fine */
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-top: 8px; 
            color: #000 !important; /* Nero */
            opacity: 0.4;
            transition: all 0.6s ease;
        }

        /* REAZIONI AL PASSAGGIO DEL CURSORE */
        .project-link:hover .project-title {
            color: #fff !important; /* Passa al bianco */
            letter-spacing: 14px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .project-link:hover .project-date {
            color: #fff !important;
            opacity: 0.8;
            transform: translateY(3px);
        }

        body:has(.project-link:hover) .archive-bg {
            filter: brightness(0.8);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 20vh; padding-left: 0; justify-content: center; }
            .project-title { font-size: 1.4rem; letter-spacing: 6px; }
            .project-link { padding: 40px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
