<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
            font-display: swap;
        }

        @font-face {
            font-family: 'BehindNineties';
            src: url('Fonts/Behind-The-Nineties-Md-It.otf') format('opentype');
            font-display: swap;
        }

        /* ANIMAZIONE FADE IN */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.4s; }
        .delay-2 { animation-delay: 0.9s; }

        body {
            margin: 0; 
            padding: 0;
            background-color: #fff; 
            color: #000; 
            font-family: 'FuturaLight', sans-serif; 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* SFONDO BIANCO FISSO */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-color: #fff;
        }

        /* Pulsante Home minimale */
        .back-home {
            position: fixed;
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.7;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        .back-home:hover { opacity: 1; }

        /* Contenitore principale */
        .container {
            max-width: 850px; 
            margin: 0 auto;
            padding: 150px 25px 100px; 
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
        }

        /* Titolo Principale ridimensionato (più piccolo e sussurrato) */
        .section-title { 
            font-family: 'BehindNineties', serif;
            font-size: clamp(2rem, 5vw, 3rem); 
            margin: 0 0 50px 0;
            text-transform: lowercase; 
            font-weight: normal; 
            color: #000;
            opacity: 1; 
        }

        /* Griglia espositiva */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 50px;
            row-gap: 80px;
            width: 100%;
        }

        /* Il blocco della singola mostra/progetto */
        .project-block {
            text-decoration: none !important;
            display: flex;
            flex-direction: column;
            color: #000 !important; 
        }

        /* Contenitore immagine con taglio orizzontale pulito */
        .img-container {
            width: 100%;
            overflow: hidden;
            background-color: rgba(0,0,0,0.05); 
            margin-bottom: 20px;
        }

        .project-img {
            width: 100%;
            display: block;
            aspect-ratio: 3 / 2; 
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Effetto hover sulla foto (solo zoom leggero) */
        .project-block:hover .project-img {
            transform: scale(1.015);
        }

        /* Dettagli testuali sotto la foto */
        .project-meta {
            padding: 0 2px;
            text-align: left;
        }

        .project-title {
            font-family: 'FuturaLight', sans-serif;
            font-size: 1.1rem; 
            font-weight: normal; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 6px 0;
        }

        .project-date {
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.8rem;
            opacity: 0.6; 
            margin: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Responsive */
        @media (max-width: 850px) {
            .archive-grid {
                column-gap: 30px;
                row-gap: 60px;
            }
        }

        @media (max-width: 600px) {
            .container { padding-top: 120px; padding-left: 20px; padding-right: 20px; }
            .section-title { font-size: 2.2rem; margin-bottom: 40px; } 
            .archive-grid {
                grid-template-columns: 1fr; 
                row-gap: 50px;
            }
            .project-img {
                aspect-ratio: 4 / 3;
            }
            .project-title { font-size: 1rem; }
            .project-date { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <a href="index.html" class="back-home">← Home</a>

    <main class="container">
        
        <header class="header-section fade-in delay-1">
            <h1 class="section-title">archive</h1>
        </header>

        <div class="archive-grid fade-in delay-2">

            <a href="principium.html" class="project-block">
                <div class="img-container">
                    <img src="atg_principium.jpeg" alt="Principium" class="project-img">
                </div>
                <div class="project-meta">
                    <h2 class="project-title">Principium</h2>
                    <p class="project-date">Chapter I - Barcelona, 2026</p>
                </div>
            </a>

            <a href="#" class="project-block" onclick="return false;" style="cursor: default; opacity: 0.4;">
                <div class="img-container">
                    <div style="width:100%; aspect-ratio: 3/2; background:rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center; font-size:0.75rem; letter-spacing:2px; color:#666; font-family:'FuturaLight', sans-serif;">Upcoming Exhibition</div>
                </div>
                <div class="project-meta">
                    <h2 class="project-title" style="text-transform: none; font-weight: normal;">To Be Announced</h2>
                    <p class="project-date">Chapter II - 2026</p>
                </div>
            </a>

        </div>
    </main>

</body>
</html>
