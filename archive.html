<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; 
            background-color: #000; 
            color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; 
            height: 100vh;
        }

        /* SFONDO CON PROFONDITÀ DINAMICA */
        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.5) contrast(1.1);
            transition: transform 2s cubic-bezier(0.15, 1, 0.3, 1), filter 2s ease;
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.15); /* Leggero zoom per dare spazio al movimento */
        }

        /* IL CONTENITORE CREA PROFONDITÀ SENZA BORDI */
        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 18vh; 
            padding-left: 10%;
        }

        .project-link {
            text-decoration: none;
            display: inline-block;
            position: relative;
            padding: 40px;
            transition: transform 0.8s cubic-bezier(0.15, 1, 0.3, 1);
        }

        /* ALONE DI LUCE AL POSTO DELLA CORNICE */
        .project-link::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 120%; height: 120%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 70%);
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0.4; /* Visibile da subito per indicare l'interattività */
            transition: all 1s ease;
            pointer-events: none;
            z-index: -1;
        }

        .project-link:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%);
        }

        .project-text-wrapper {
            position: relative;
            z-index: 2;
        }

        .project-title { 
            font-size: 2rem; 
            letter-spacing: 12px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #fff;
            /* OMBRA DISTANTE PER PROFONDITÀ */
            text-shadow: 0 15px 35px rgba(0, 0, 0, 0.8); 
            transition: all 0.8s cubic-bezier(0.15, 1, 0.3, 1);
            opacity: 0.8;
        }

        .project-date { 
            font-size: 0.65rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-top: 15px; 
            color: #fff; 
            opacity: 0.4;
            transition: all 0.8s ease;
        }

        /* EFFETTO HOVER: IL TESTO SI "ALZA" DALLO SCHERMO */
        .project-link:hover {
            transform: translateY(-10px) scale(1.02);
        }

        .project-link:hover .project-title {
            opacity: 1;
            letter-spacing: 16px;
            /* L'ombra si sposta e si fa più sfocata quando il testo si alza */
            text-shadow: 0 30px 50px rgba(0, 0, 0, 0.9);
        }

        .project-link:hover .project-date {
            opacity: 0.8;
            letter-spacing: 6px;
        }

        /* REAZIONE DELLO SFONDO */
        body:has(.project-link:hover) .archive-bg {
            filter: brightness(0.7);
            transform: scale(1.08) translateY(10px);
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 25vh; padding-left: 0; justify-content: center; }
            .project-title { font-size: 1.5rem; letter-spacing: 8px; }
            .project-link:hover .project-title { letter-spacing: 10px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
