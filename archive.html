<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; /* Il fondo resta nero, ma le foto saranno chiare */
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO PAGINA - OPACITÀ AL MASSIMO (1) */
        .archive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: url('archive_background_final.jpg') no-repeat center center;
            background-size: cover;
            opacity: 1; /* Rimosso il grigio/nero, ora è l'immagine pura */
        }

        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; opacity: 0.8; z-index: 10;
        }

        .archive-content {
            position: absolute;
            top: 150px;
            left: 50px;
            z-index: 5;
        }

        .project-link {
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 450px; 
            height: 250px;
        }

        /* IMMAGINE CAOS - OPACITÀ AL MASSIMO (1) */
        .caos-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 1; /* Via il nero, ora è vivida */
            z-index: 1;
            /* Resta solo la sfumatura ai bordi per pulizia */
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 10%, rgba(0,0,0,0) 85%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 10%, rgba(0,0,0,0) 85%);
        }

        .project-info {
            position: relative;
            z-index: 2; 
            text-align: center;
            text-shadow: 0px 0px 10px rgba(0,0,0,0.5); /* Leggera ombra per leggere il testo se la foto è chiara */
        }

        .project-title { 
            font-size: 1.3rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0; 
        }

        .project-date { 
            font-size: 0.6rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.9; 
            margin-top: 8px; 
        }

    </style>
</head>
<body>

    <div class="archive-bg"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <img src="caos.jpg" class="caos-image">
            <div class="project-info">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2024</p>
            </div>
        </a>
    </div>

</body>
</html>
