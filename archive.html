<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        /* FADE SOLO PER IL CONTENUTO ALL'APERTURA */
        @keyframes contentFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body {
            margin: 0; 
            background-color: #000; 
            color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; 
            height: 100vh;
        }

        /* SFONDO STATICO - NESSUNA ANIMAZIONE */
        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden; /* Impedisce barre di scorrimento causate dallo zoom */
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            display: block;
            transform: scale(1.1); /* ZOOM APPLICATO QUI */
            transform-origin: center;
        }

        .back-home {
            position: fixed;
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000 !important;
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.4;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        .back-home:visited { color: #000 !important; }
        .back-home:hover { opacity: 1; }

        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 18vh; 
            padding-left: 10%;
            /* Il fade avviene solo qui */
            animation: contentFadeIn 2s ease-in-out forwards;
        }

        /* CORNICE SOTTILE */
        .project-link {
            text-decoration: none !important;
            display: inline-block;
            padding: 40px 50px;
            z-index: 100;
            border: 0.5px solid rgba(0, 0, 0, 0.2);
            background: transparent;
            transition: all 0.8s ease-in-out;
        }

        .project-link:hover {
            border-color: rgba(255, 255, 255, 1);
            background: rgba(255, 255, 255, 0.05);
        }

        .project-title { 
            font-size: 1.8rem; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #000 !important; 
            transition: all 0.8s ease-in-out;
        }

        .project-date { 
            font-size: 0.75rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-top: 15px; 
            color: #000 !important;
            opacity: 0.6;
            transition: all 0.8s ease-in-out;
            display: block;
        }

        /* EFFETTO FADE HOVER SUL TESTO */
        .project-link:hover .project-title {
            color: #fff !important;
            letter-spacing: 13px;
        }

        .project-link:hover .project-date {
            color: #fff !important;
            opacity: 1;
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 25vh; padding-left: 0; justify-content: center; }
            .project-link { width: 85%; text-align: center; padding: 30px 20px; }
            .project-title { font-size: 1.4rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
