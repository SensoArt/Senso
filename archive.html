<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            overflow: hidden;
        }

        /* SFONDO PRINCIPALE */
        .archive-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .archive-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        /* CONTENUTO */
        .archive-content {
            position: relative;
            z-index: 10;
            padding-top: 140px;
            padding-left: 50px;
        }

        /* MINIATURA CAOS */
        .project-thumbnail {
            position: absolute;
            top: -50px; /* Posizionata per avvolgere il titolo */
            left: -40px;
            width: 320px; 
            height: 200px;
            object-fit: cover;
            z-index: -1; /* Fondamentale: resta dietro la scritta Principium */
            opacity: 0.8;
            filter: blur(10px); /* Effetto nebulosa */
            /* Sfuma i bordi verso l'esterno */
            mask-image: radial-gradient(circle, black 20%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle, black 20%, transparent 80%);
            pointer-events: none;
        }

        .project-link { 
            text-decoration: none; 
            position: relative; 
            display: inline-block;
        }

        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #000;
            text-transform: uppercase;
            font-size: 0.65rem; letter-spacing: 2px; opacity: 0.8;
            z-index: 20;
        }

        .project-title { 
            font-size: 1.5rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #000; /* Nero come richiesto */
        }
        
        .project-date { 
            font-size: 0.7rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.7; 
            margin-top: 10px; 
            color: #000; /* Nero come richiesto */
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="Background">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <img src="caos.jpg" class="project-thumbnail" alt="">
            
            <h2 class="project-title">Principium</h2>
            <p class="project-date">Chapter I — Barcelona, May 2026</p>
        </a>
    </div>

</body>
</html>
