<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO - Senza overlay, senza opacità. Se c'è, deve vedersi al 100% */
        .archive-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; /* Portato davanti a tutto per test */
        }

        .archive-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        /* CONTENUTO - Sopra l'immagine */
        .archive-content {
            position: relative;
            z-index: 10;
            padding-top: 140px;
            padding-left: 50px;
        }

        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #fff; text-transform: uppercase;
            font-size: 0.65rem; letter-spacing: 2px; opacity: 0.8;
            z-index: 20;
        }

        .project-link { text-decoration: none; color: #fff; }
        .project-title { font-size: 1.5rem; letter-spacing: 5px; text-transform: uppercase; margin: 0; }
        .project-date { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="test">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <h2 class="project-title">Principium</h2>
            <p class="project-date">Chapter I — Barcelona, 2024</p>
        </a>
    </div>

</body>
</html>
