<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; overflow: hidden;
        }

        .archive-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
        }

        .archive-bg img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 1; 
            display: block;
        }
        
        /* TASTO HOME ALLINEATO ALLA FOTO 2 */
        .back-home {
            position: absolute; 
            top: 25px; /* Modificato da 35px a 25px per pareggiare About */
            left: 20px; /* Modificato da 50px a 20px per pareggiare About */
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.8;
            z-index: 10;
        }

        .archive-content {
            position: absolute; 
            top: 140px; 
            left: 0; 
            right: 0; 
            display: flex; 
            justify-content: center; 
            z-index: 5;
        }

        .project-link { 
            text-decoration: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 320px; 
            height: 180px;
        }

        .project-text-wrapper {
            position: relative;
            z-index: 2;
            padding-top: 50px;
            text-align: center;
            opacity: 0;
            animation: fadeInText 1.2s ease-out forwards;
            animation-delay: 0.4s;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-title { 
            font-size: 1.5rem; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #1a1a1a; 
        }

        .project-date { 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 10px; 
            color: #333; 
        }

        /* Responsive Mobile */
        @media (max-width: 600px) {
            .back-home { top: 25px; left: 20px; }
            .archive-content { top: 120px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, May 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
