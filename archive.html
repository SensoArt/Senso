<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.7) blur(2px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1);
        }

        /* SFONDO REATTIVO ALL'HOVER */
        body:has(.project-link:hover) .archive-bg {
            filter: brightness(1) blur(0px);
            transform: scale(1.02);
        }

        .back-home {
            position: absolute; 
            top: 25px; left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.5;
            z-index: 10;
        }

        .archive-content {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 8%;
        }

        /* LA CORNICE */
        .project-link {
            text-decoration: none;
            display: inline-block;
            padding: 40px 60px; /* Spazio interno alla cornice */
            border: 0.5px solid rgba(0, 0, 0, 0.1); /* Quasi invisibile all'inizio */
            position: relative;
            transition: all 0.6s ease;
        }

        /* Angoli della cornice (opzionali, per un tocco più tecnico) */
        .project-link::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0.5px solid rgba(255, 255, 255, 0.1); /* Cornice sottilissima bianca */
            transition: all 0.6s ease;
        }

        .project-link:hover::before {
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.05); /* La cornice si espande leggermente */
        }

        .project-text-wrapper {
            position: relative;
            z-index: 2;
        }

        .project-title { 
            font-size: 1.8rem; /* Dimensione ridotta per eleganza */
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #1a1a1a; 
            transition: all 0.6s ease;
        }

        .project-date { 
            font-size: 0.6rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-top: 12px; 
            color: #333; 
            opacity: 0.7;
            transition: all 0.6s ease;
        }

        /* Effetti all'hover */
        .project-link:hover .project-title {
            color: #fff;
            letter-spacing: 12px;
        }

        .project-link:hover .project-date {
            color: #fff;
            opacity: 1;
        }

        @media (max-width: 600px) {
            .archive-content { padding-left: 20px; justify-content: center; padding-right: 20px; }
            .project-link { padding: 30px; width: 80%; text-align: center; }
            .project-title { font-size: 1.4rem; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
