<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO - OPACITÀ 100% - NESSUN FILTRO NERO */
        .archive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: url('archive_background_final.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1 !important; /* Forza opacità massima */
        }

        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; z-index: 10;
        }

        .archive-content {
            position: absolute;
            top: 140px;
            left: 50px;
            z-index: 5;
        }

        /* CONTENITORE PROGETTO - DIMENSIONI RIDOTTE PER ELEGANZA */
        .project-link {
            text-decoration: none;
            color: #fff;
            position: relative;
            width: 340px; 
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* IMMAGINE CAOS - OPACITÀ 100% */
        .caos-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 1 !important; /* Forza opacità massima */
            /* Sfuma solo i bordi esterni per non farla sembrare un adesivo */
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 90%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 90%);
        }

        .project-info {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .project-title { 
            font-size: 1.1rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0;
            font-weight: normal;
        }

        .project-date { 
            font-size: 0.55rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 6px;
        }

        /* MOBILE FIX PER CENTRATURA */
        @media (max-width: 600px) {
            .back-home { left: 30px; }
            .archive-content { 
                left: 0; right: 0; 
                display: flex; 
                justify-content: center; 
                top: 120px; 
            }
            .project-link { width: 80%; }
        }
    </style>
</head>
<body>

    <div class="archive-bg"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <img src="caos.jpg" class="caos-image" alt="Principium">
            <div class="project-info">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2024</p>
            </div>
        </a>
    </div>

</body>
</html>
