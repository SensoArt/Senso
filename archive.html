<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .archive-bg {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: -2;
            overflow: hidden; /* Fondamentale per nascondere ciò che esce dai bordi */
        }

        .archive-bg img {
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            display: block;
            /* SOLUZIONE PER LA STELLA: */
            /* Ingrandiamo l'immagine del 10% e la spostiamo leggermente verso l'alto/sinistra */
            transform: scale(1.1); 
            transform-origin: top left; 
            filter: brightness(1);
        }
        
        .back-home {
            position: absolute; 
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.8;
            z-index: 10;
        }

        .archive-content {
            position: absolute; 
            top: 140px; 
            left: 75px; 
            text-align: left;
            z-index: 5;
        }

        .project-text-wrapper {
            position: relative;
            z-index: 2;
            padding-top: 50px;
            text-align: left;
            opacity: 0;
            animation: fadeInText 1.2s ease-out forwards;
            animation-delay: 0.4s;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .project-title { 
            font-size: 1.5rem; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #1a1a1a; 
            display: block;
        }

        .project-date { 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 10px; 
            color: #333; 
            display: block;
        }

        @media (max-width: 600px) {
            .back-home { left: 20px; }
            .archive-content { left: 30px; }
            .archive-bg img {
                transform: scale(1.2); /* Su mobile zoomiamo un po' di più per sicurezza */
            }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" style="text-decoration: none;">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I - Barcelona, May 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
