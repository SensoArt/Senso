<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO DELLA PAGINA (Il tuo file di background) */
        .archive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-image: url('archive_background_final.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.35;
        }

        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; opacity: 0.5; z-index: 10;
        }

        /* CONTENITORE PRINCIPALE (SPOSTATO A SINISTRA) */
        .archive-content {
            position: absolute;
            top: 150px;
            left: 50px;
            z-index: 5;
        }

        /* IL LINK CHE CONTIENE TUTTO */
        .project-link {
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 500px; /* Dimensione dell'immagine caos */
            height: 300px;
        }

        /* IMMAGINE CAOS (DENTRO IL LINK) */
        .caos-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.8;
            /* Sfuma i bordi per non sembrare una macchia tagliata */
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 80%);
        }

        /* TESTO SOPRA L'IMMAGINE CAOS */
        .project-info {
            position: relative;
            z-index: 2; /* Sta sopra l'immagine caos */
            text-align: center;
        }

        .project-title { 
            font-size: 1.35rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0; 
        }

        .project-date { 
            font-size: 0.6rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.7; 
            margin-top: 8px; 
        }

    </style>
</head>
<body>

    <div class="archive-bg"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <img src="caos.jpg" class="caos-image" alt="Caos">
            
            <div class="project-info">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2024</p>
            </div>
        </a>
    </div>

</body>
</html>
