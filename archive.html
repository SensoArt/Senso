<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #000; /* TESTO NERO */
            overflow: hidden;
        }

        /* SFONDO */
        .archive-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .archive-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        /* CONTENUTO */
        .archive-content {
            position: relative;
            z-index: 10;
            padding-top: 140px;
            padding-left: 50px;
        }

        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; 
            color: #000; /* HOME NERO */
            text-transform: uppercase;
            font-size: 0.65rem; letter-spacing: 2px; opacity: 0.8;
            z-index: 20;
        }

        .project-link { text-decoration: none; color: #000; } /* LINK NERO */
        
        .project-title { 
            font-size: 1.5rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #000; /* TITOLO NERO */
        }
        
        .project-date { 
            font-size: 0.7rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            opacity: 0.7; 
            margin-top: 10px; 
            color: #000; /* DATA NERO */
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="Background">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <h2 class="project-title">Principium</h2>
            <p class="project-date">Chapter I — Barcelona, May 2026</p>
        </a>
    </div>

</body>
</html>
