<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.7) blur(1px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1);
        }

        /* SFONDO CHE REAGISCE */
        body:has(.project-link:hover) .archive-bg {
            filter: brightness(0.9) blur(0px);
            transform: scale(1.05);
        }

        .back-home {
            position: absolute; 
            top: 25px; left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.5;
            z-index: 10;
        }

        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start; /* Spostato in alto */
            justify-content: flex-start;
            padding-top: 180px; /* Altezza precisa dal bordo superiore */
            padding-left: 8%;
        }

        /* LA CORNICE SEMPRE VISIBILE */
        .project-link {
            text-decoration: none;
            display: inline-block;
            padding: 35px 50px;
            position: relative;
            transition: all 0.5s ease;
        }

        /* Bordo fisso sottile */
        .project-link::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 0.8px solid rgba(255, 255, 255, 0.25); /* Visibile ma discreto */
            transition: all 0.5s ease;
        }

        /* Effetto quando ci passi sopra */
        .project-link:hover::before {
            border-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.03);
            background-color: rgba(255, 255, 255, 0.03); /* Un velo di luce interno */
        }

        .project-text-wrapper {
            position: relative;
            z-index: 2;
        }

        .project-title { 
            font-size: 1.6rem; 
            letter-spacing: 7px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #1a1a1a; /* Grigio scuro per contrasto con lo sfondo */
            transition: all 0.5s ease;
        }

        .project-date { 
            font-size: 0.6rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-top: 10px; 
            color: #333; 
            opacity: 0.7;
            transition: all 0.5s ease;
        }

        /* Hover sul testo */
        .project-link:hover .project-title {
            color: #fff;
            letter-spacing: 10px;
        }

        .project-link:hover .project-date {
            color: #fff;
            opacity: 1;
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 150px; padding-left: 20px; justify-content: center; padding-right: 20px; }
            .project-link { padding: 25px 35px; width: 85%; text-align: center; }
            .project-title { font-size: 1.3rem; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
