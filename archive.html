<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO PAGINA - Caricato come immagine fissa per massima compatibilità */
        .archive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }
        .archive-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .back-home {
            position: absolute; top: 35px; left: 30px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; z-index: 10;
        }

        /* CONTENITORE ADATTIVO PER MOBILE */
        .archive-content {
            position: absolute;
            top: 150px;
            left: 30px; /* Ridotto per stare meglio su mobile */
            right: 30px;
            z-index: 5;
        }

        .project-link {
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 500px; /* Limite massimo su computer */
            height: 280px;
        }

        /* IMMAGINE CAOS SFUMATA */
        .caos-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            /* Sfuma i bordi su tutti i lati */
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 85%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 85%);
        }

        .project-info {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 10px;
        }

        .project-title { 
            font-size: 1.25rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin: 0; 
        }

        .project-date { 
            font-size: 0.55rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 8px; 
            opacity: 0.8;
        }

        /* FIX PER SCHERMI PICCOLI (CELLULARE) */
        @media (max-width: 600px) {
            .back-home { left: 20px; top: 30px; }
            .archive-content { left: 0; right: 0; padding: 0 20px; top: 120px; }
            .project-link { height: 220px; }
            .project-title { font-size: 1.1rem; letter-spacing: 3px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <img src="caos.jpg" class="caos-image">
            <div class="project-info">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2024</p>
            </div>
        </a>
    </div>

</body>
</html>
