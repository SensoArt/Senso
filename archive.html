<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; overflow: hidden;
        }

        .archive-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
        }

        .archive-bg img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 1; 
            display: block;
        }
        
        .back-home {
            position: absolute; top: 35px; left: 50px;
            text-decoration: none; color: #fff; text-transform: uppercase;
            font-size: 0.65rem; letter-spacing: 2px; opacity: 0.5;
        }

        .archive-content {
            position: absolute; top: 140px; left: 50px; 
            text-align: left; z-index: 5;
        }

        .project-link { 
            text-decoration: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 280px; 
            height: 160px;
        }

        /* CAOS RIMOSSO */

        .project-text-wrapper {
            position: relative;
            z-index: 2;
            padding-top: 45px; /* Mantiene il testo più giù */
            text-align: center;
        }

        .project-title { 
            font-size: 1.15rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #1a1a1a; /* Testo scuro come richiesto */
        }

        .project-date { 
            font-size: 0.55rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 6px; 
            color: #333; 
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2024</p>
            </div>
        </a>
    </div>

</body>
</html>
