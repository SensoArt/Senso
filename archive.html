<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
            font-display: swap;
        }

        /* Fade in elegante all'apertura della pagina */
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            margin: 0; 
            padding: 0;
            background-color: #ffffff; /* Preso da catalogue.html */
            color: #222222;            /* Preso da catalogue.html */
            font-family: 'FuturaLight', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }

        /* Pulsante Home minimale identico a catalogue.html */
        .back-home {
            position: fixed;
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #222;
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.5;
            z-index: 1000;
            transition: 0.3s;
        }
        .back-home:hover { opacity: 1; }

        /* Contenitore principale allineato a catalogue.html */
        .archive-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pageFadeIn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Struttura Header identica a catalogue.html */
        .header-section {
            text-align: center;
            margin-bottom: 100px;
            width: 100%;
        }

        /* Stile del titolo IDENTICO a h1 di catalogue.html */
        .header-section h1 {
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.5;
            margin: 0;
            color: #222222;
        }

        /* Griglia espositiva a 2 colonne ampie e ariose */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 50px;
            row-gap: 80px;
            width: 100%;
            max-width: 1200px; /* Bilanciato con i box grandi del catalogo */
        }

        /* Il blocco della singola mostra/progetto */
        .project-block {
            text-decoration: none !important;
            display: flex;
            flex-direction: column;
            color: #222222 !important;
        }

        /* Contenitore immagine con taglio orizzontale pulito */
        .img-container {
            width: 100%;
            overflow: hidden;
            background-color: #f7f7f7;
            margin-bottom: 20px;
        }

        .project-img {
            width: 100%;
            display: block;
            aspect-ratio: 3 / 2; /* Taglio fotografico geometrico */
            object-fit: cover;
            filter: grayscale(100%); 
            transition: filter 0.7s cubic-bezier(0.25, 1, 0.5, 1), transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Effetto hover morbido sulla foto */
        .project-block:hover .project-img {
            filter: grayscale(0%);
            transform: scale(1.015);
        }

        /* Dettagli testuali sotto la foto */
        .project-meta {
            padding: 0 2px;
        }

        .project-title {
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 6px 0;
        }

        .project-date {
            font-size: 0.75rem;
            opacity: 0.5;
            margin: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Responsive per Tablet e Smartphone */
        @media (max-width: 850px) {
            .archive-grid {
                column-gap: 30px;
                row-gap: 60px;
            }
        }

        @media (max-width: 600px) {
            .archive-container { padding: 100px 15px 60px 15px; }
            .archive-grid {
                grid-template-columns: 1fr; /* Una sola colonna su smartphone */
                row-gap: 50px;
            }
            .project-img {
                aspect-ratio: 4 / 3;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-container">
        
        <header class="header-section">
            <h1>Archive</h1>
        </header>

        <div class="archive-grid">

            <!-- MOSTRA 1: PRINCIPIUM -->
            <a href="principium.html" class="project-block">
                <div class="img-container">
                    <img src="archive_background_final.jpg" alt="Principium" class="project-img">
                </div>
                <div class="project-meta">
                    <h2 class="project-title">Principium</h2>
                    <p class="project-date">Chapter I - Barcelona, 2026</p>
                </div>
            </a>

            <!-- MOSTRA 2: SEGNAPOSTO PROGETTO FUTURO -->
            <a href="#" class="project-block" onclick="return false;" style="cursor: default; opacity: 0.4;">
                <div class="img-container">
                    <div style="width:100%; aspect-ratio: 3/2; background:#f0f0f0; display:flex; align-items:center; justify-content:center; font-size:0.75rem; letter-spacing:2px; color:#aaa;">Upcoming Exhibition</div>
                </div>
                <div class="project-meta">
                    <!-- text-transform rimosso completamente qui, ora mostra il testo normale scritto sotto -->
                    <h2 class="project-title" style="text-transform: none; font-weight: normal;">To Be Announced</h2>
                    <p class="project-date">Chapter II - 2026</p>
                </div>
            </a>

        </div>
    </div>

</body>
</html>
