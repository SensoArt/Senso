<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.6) blur(2px);
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1);
        }

        /* SFONDO REATTIVO */
        body:has(.project-link:hover) .archive-bg {
            filter: brightness(0.8) blur(0px);
            transform: scale(1.03);
        }

        .back-home {
            position: absolute; 
            top: 25px; left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.5;
            z-index: 10;
        }

        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 160px; 
            padding-left: 10%;
        }

        /* LA CORNICE CON PROFONDITÀ */
        .project-link {
            text-decoration: none;
            display: inline-block;
            padding: 45px 60px;
            position: relative;
            background: rgba(255, 255, 255, 0.02); /* Velo quasi invisibile */
            backdrop-filter: blur(5px); /* Sfoca leggermente l'immagine dietro la cornice */
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5), /* Ombra esterna per staccare dal fondo */
                inset 0 0 15px rgba(255, 255, 255, 0.05); /* Luce interna per volume */
            border-left: 1px solid rgba(255, 255, 255, 0.3); /* Bordo sinistro più acceso */
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-link:hover {
            transform: translateY(-5px); /* Si alza leggermente */
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7), 
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* Effetto "vetro" o riflesso sulla cornice */
        .project-link::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        .project-text-wrapper {
            position: relative;
            z-index: 2;
        }

        .project-title { 
            font-size: 1.7rem; 
            letter-spacing: 8px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #111; /* Quasi nero per sembrare scavato */
            transition: all 0.6s ease;
            text-shadow: 0 1px 1px rgba(255,255,255,0.1);
        }

        .project-date { 
            font-size: 0.65rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-top: 12px; 
            color: #222; 
            opacity: 0.8;
            transition: all 0.6s ease;
        }

        /* Reazione al passaggio del mouse */
        .project-link:hover .project-title {
            color: #fff;
            letter-spacing: 11px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .project-link:hover .project-date {
            color: #ccc;
            opacity: 1;
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 140px; padding-left: 0; justify-content: center; }
            .project-link { padding: 35px 40px; width: 80%; text-align: center; }
            .project-title { font-size: 1.4rem; letter-spacing: 5px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
