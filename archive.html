<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.6);
            transition: all 1.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1);
        }

        /* REAZIONE DELLO SFONDO */
        body:has(.project-link:hover) .archive-bg {
            filter: brightness(0.8);
            transform: scale(1.05);
        }

        .back-home {
            position: absolute; 
            top: 25px; left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.5;
            z-index: 10;
        }

        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 15vh; 
            padding-left: 10%;
        }

        /* CORNICE APERTA (ANGOLI) */
        .project-link {
            text-decoration: none;
            display: inline-block;
            padding: 50px 70px;
            position: relative;
            transition: all 0.6s ease;
        }

        /* Angoli superiori */
        .project-link::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 30px; height: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.6s ease;
        }

        /* Angoli inferiori */
        .project-link::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 30px; height: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.6s ease;
        }

        /* Animazione al passaggio del mouse: gli angoli si espandono e avvolgono il testo */
        .project-link:hover::before {
            width: 100%; height: 100%;
            border-color: rgba(255, 255, 255, 0.8);
        }

        .project-link:hover::after {
            width: 100%; height: 100%;
            border-color: rgba(255, 255, 255, 0.8);
        }

        .project-text-wrapper {
            position: relative;
            z-index: 2;
        }

        .project-title { 
            font-size: 1.8rem; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #111; 
            transition: all 0.6s ease;
            mix-blend-mode: overlay; /* Fa sì che il testo interagisca con la luce dello sfondo */
        }

        .project-date { 
            font-size: 0.65rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-top: 15px; 
            color: #fff; 
            opacity: 0.3;
            transition: all 0.6s ease;
        }

        /* Hover sul testo */
        .project-link:hover .project-title {
            color: #fff;
            letter-spacing: 14px;
            mix-blend-mode: normal;
        }

        .project-link:hover .project-date {
            opacity: 1;
            transform: translateY(5px);
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 20vh; padding-left: 0; justify-content: center; }
            .project-link { padding: 40px; }
            .project-title { font-size: 1.4rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
