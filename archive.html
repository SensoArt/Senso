<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; 
            background-color: #000; 
            color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; 
            height: 100vh;
        }

        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.75);
            transition: all 1.5s cubic-bezier(0.15, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1);
        }

        .back-home {
            position: fixed;
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000 !important;
            text-transform: uppercase;
            font-size: 0.6rem; 
            letter-spacing: 2px; 
            opacity: 0.4;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        .back-home:visited { color: #000 !important; }
        .back-home:hover { opacity: 1; }

        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 15vh; 
            padding-left: 10%;
        }

        .project-link {
            text-decoration: none !important;
            display: inline-block;
            position: relative;
            padding: 20px; /* Area cliccabile invisibile */
            z-index: 100;
        }

        .project-text-wrapper {
            transition: transform 0.8s cubic-bezier(0.15, 1, 0.3, 1);
        }

        .project-title { 
            font-size: 1.8rem; 
            letter-spacing: 12px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #000 !important; /* Nero iniziale */
            /* Ombra che crea profondità senza contorni */
            text-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); 
            transition: all 0.7s ease;
        }

        .project-date { 
            font-size: 0.5rem; /* Piccolissimo ed elegante */
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin-top: 10px; 
            color: #000 !important;
            opacity: 0.5; /* Fine e discreto */
            transition: all 0.7s ease;
        }

        /* --- EFFETTI AL PASSAGGIO DEL CURSORE --- */

        .project-link:hover .project-text-wrapper {
            transform: translateY(-5px); /* Si solleva leggermente */
        }

        .project-link:hover .project-title {
            color: #fff !important; /* Cambio colore in bianco */
            letter-spacing: 15px; /* Si espande con grazia */
            text-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .project-link:hover .project-date {
            color: #fff !important;
            opacity: 0.9;
            letter-spacing: 7px;
        }

        /* Lo sfondo reagisce solo scurendosi leggermente per dare focus */
        body:has(.project-link:hover) .archive-bg {
            filter: brightness(0.65);
            transform: scale(1.03);
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 20vh; padding-left: 0; justify-content: center; }
            .project-title { font-size: 1.4rem; letter-spacing: 7px; }
            .project-link:hover .project-title { letter-spacing: 10px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
