<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Archive</title>
    <link rel="icon" type="image/png" href="favicon.png?v=101">
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000;
            font-family: 'FuturaLight', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* SFONDO - OPACITÀ 100% (NESSUN NERO SOPRA) */
        .archive-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: url('archive_background_final.jpg') no-repeat center center;
            background-size: cover;
            opacity: 1; /* Massima luminosità */
        }

        .back-home {
            position: absolute; top: 35px; left: 30px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; z-index: 10;
        }

        .archive-content {
            position: absolute;
            top: 140px;
            left: 30px;
            right: 30px;
            z-index: 5;
            display: flex;
        }

        .project-link {
            text-decoration: none;
            color: #fff;
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* IMMAGINE CAOS - OPACITÀ 100% (NESSUN NERO SOPRA) */
        .caos-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 1; /* Massima luminosità */
            z-index: 1;
            /* Sfuma solo i bordi esterni per pulizia artistica */
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 90%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 90%);
        }

        .project-info {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .project-title { 
            font-size: 1.3rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin: 0;
            font-weight: normal;
        }

        .project-date { 
            font-size: 0.55rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            margin-top: 8px;
        }

        /* RESPONSIVE PER CELLULARE */
        @media (max-width: 600px) {
            .archive-content { top: 120px; left: 0; right: 0; justify-content: center; padding: 0 20px; }
            .project-link { height: 220px; max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="archive-bg"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <img src="caos.jpg" class="caos-image">
            <div class="project-info">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2024</p>
            </div>
        </a>
    </div>

</body>
</html>
