<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; 
            background-color: #000; 
            color: #fff;
            font-family: 'FuturaLight', sans-serif; 
            overflow: hidden;
            width: 100vw; 
            height: 100vh;
        }

        /* SFONDO */
        .archive-bg {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            filter: brightness(0.5);
            transition: transform 2s cubic-bezier(0.15, 1, 0.3, 1);
        }

        .archive-bg img {
            width: 100%; height: 100%; 
            object-fit: cover;
            transform: scale(1.1);
        }

        /* --- FIX TASTO HOME (NO VIOLA, NO BLOCCO) --- */
        .back-home {
            position: fixed; /* Fixed per essere sempre sopra tutto */
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #fff !important; /* Forza il bianco */
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.6;
            z-index: 9999; /* Sopra ogni altra cosa */
            transition: opacity 0.3s;
            display: block;
        }
        
        /* Impedisce il colore viola dei link visitati */
        .back-home:visited { color: #fff !important; }
        .back-home:hover { opacity: 1; }

        /* CONTENUTO */
        .archive-content {
            height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 18vh; 
            padding-left: 10%;
        }

        .project-link {
            text-decoration: none !important;
            display: inline-block;
            position: relative;
            padding: 40px;
            z-index: 100;
        }

        /* ALONE DI LUCE PROFONDA */
        .project-link::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 140%; height: 140%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0.3;
            transition: all 1s ease;
            pointer-events: none;
        }

        .project-link:hover::before {
            opacity: 0.8;
            transform: translate(-50%, -50%) scale(1.2);
        }

        .project-title { 
            font-size: 2rem; 
            letter-spacing: 12px; 
            text-transform: uppercase; 
            margin: 0; 
            color: #fff !important; /* No viola */
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
            transition: all 0.8s cubic-bezier(0.15, 1, 0.3, 1);
            opacity: 0.8;
        }

        .project-link:visited .project-title { color: #fff !important; }

        .project-date { 
            font-size: 0.65rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-top: 15px; 
            color: #fff; 
            opacity: 0.4;
            transition: all 0.6s ease;
        }

        /* EFFETTO PROFONDITÀ ALL'HOVER */
        .project-link:hover .project-title {
            opacity: 1;
            letter-spacing: 16px;
            transform: translateY(-5px);
            text-shadow: 0 20px 40px rgba(0, 0, 0, 1);
        }

        .project-link:hover .project-date {
            opacity: 0.8;
            transform: translateY(5px);
        }

        /* REAZIONE SFONDO */
        body:has(.project-link:hover) .archive-bg {
            transform: scale(1.05);
            filter: brightness(0.7);
        }

        @media (max-width: 600px) {
            .archive-content { padding-top: 25vh; padding-left: 0; justify-content: center; }
            .project-title { font-size: 1.5rem; letter-spacing: 8px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <a href="principium.html" class="project-link">
            <div class="project-text-wrapper">
                <h2 class="project-title">Principium</h2>
                <p class="project-date">Chapter I — Barcelona, 2026</p>
            </div>
        </a>
    </div>

</body>
</html>
