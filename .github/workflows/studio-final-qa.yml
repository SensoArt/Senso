name: Studio final responsive QA
on:
  push:
    branches:
      - studio-final-mobile-footer-20261005
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 4173 >/tmp/senso-http.log 2>&1 &
          sleep 2
      - name: QA Studio and footer icons
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const viewports=[
            ['mobile-360',360,640],
            ['iphone-390',390,844],
            ['mobile-430',430,932],
            ['tablet-768',768,1024],
            ['tablet-landscape',1024,768],
            ['desktop-1280',1280,800],
            ['desktop-1440',1440,900]
          ];
          const failures=[];
          const expectedFooter=fs.readFileSync('art-consulting.html','utf8')
            .match(/<div class="footer-socials">[\s\S]*?<\/div>(?=\s*<\/footer>)/i)?.[0];
          if(!expectedFooter) failures.push('Cannot read canonical footer icons');
          for(const file of ['studio.html','artists.html','arantxa-martinez-dugas.html','carlotta-valentinis.html','catherine-parra.html']){
            const html=fs.readFileSync(file,'utf8');
            const socials=html.match(/<div class="footer-socials">[\s\S]*?<\/div>(?=\s*<\/footer>)/i)?.[0];
            if(socials!==expectedFooter) failures.push(file+': footer icons do not match canonical Art Consulting footer');
          }
          const studioHtml=fs.readFileSync('studio.html','utf8');
          if(/Artists \| Process \| Experience \| Context/.test(studioHtml)) failures.push('EN practice descriptor still present');
          if(/Artistas \| Proceso \| Experiencia \| Contexto/.test(studioHtml)) failures.push('ES practice descriptor still present');
          for(const [name,width,height] of viewports){
            const ctx=await browser.newContext({viewport:{width,height}});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/studio.html',{waitUntil:'networkidle'});
            await page.evaluate(()=>document.fonts.ready);
            const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            if(dims.sw>dims.cw+2) failures.push(name+': horizontal overflow '+dims.sw+'>'+dims.cw);
            const activeWeight=Number(await page.locator('.lang-btn.active').evaluate(el=>getComputedStyle(el).fontWeight));
            if(activeWeight>500) failures.push(name+': EN/ES active is bold '+activeWeight);
            const titles=await page.locator('.entry-card h3').evaluateAll(els=>els.map(el=>({font:getComputedStyle(el).fontFamily,size:getComputedStyle(el).fontSize})));
            if(titles.some(x=>!x.font.toLowerCase().includes('behind'))) failures.push(name+': Studio business/individuals not using Behind font');
            const enH2=page.locator('.products-head [data-lang="en"] h2');
            if(await enH2.count()!==1) failures.push(name+': missing Enter the practice heading');
            const offset=await enH2.evaluate(el=>{
              const p=el.closest('.products-head').getBoundingClientRect();
              const r=el.getBoundingClientRect();
              return r.top-p.top;
            });
            if(offset<65) failures.push(name+': practice title not lowered enough, offset='+offset);
            await page.evaluate(()=>{try{localStorage.setItem('senso_lang','es')}catch(e){}});
            await page.reload({waitUntil:'networkidle'});
            if(await page.getAttribute('html','lang')!=='es') failures.push(name+': ES switch state failed');
            if(await page.getByText('Artistas | Proceso | Experiencia | Contexto',{exact:true}).count()) failures.push(name+': ES descriptor visible');
            if(width<=900){
              const studio=await page.evaluate(()=>({
                header:getComputedStyle(document.querySelector('.senso-header')).padding,
                direction:getComputedStyle(document.querySelector('.senso-header')).flexDirection,
                navWrap:getComputedStyle(document.querySelector('#nav-es')).flexWrap,
                navSize:getComputedStyle(document.querySelector('#nav-es')).fontSize,
                langSize:getComputedStyle(document.querySelector('.lang-switch')).fontSize
              }));
              const ref=await ctx.newPage();
              await ref.goto('http://127.0.0.1:4173/art-consulting.html',{waitUntil:'networkidle'});
              await ref.evaluate(()=>document.fonts.ready);
              const consulting=await ref.evaluate(()=>({
                header:getComputedStyle(document.querySelector('.senso-header')).padding,
                direction:getComputedStyle(document.querySelector('.senso-header')).flexDirection,
                navWrap:getComputedStyle(document.querySelector('#nav-en')).flexWrap,
                navSize:getComputedStyle(document.querySelector('#nav-en')).fontSize,
                langSize:getComputedStyle(document.querySelector('.lang-switch')).fontSize
              }));
              if(JSON.stringify(studio)!==JSON.stringify(consulting)) failures.push(name+': Studio mobile header differs from Art Consulting: '+JSON.stringify({studio,consulting}));
              await ref.close();
            }
            if(errors.length) failures.push(...errors.map(e=>name+': '+e));
            await ctx.close();
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('STUDIO_FINAL_QA_OK');
          JS
