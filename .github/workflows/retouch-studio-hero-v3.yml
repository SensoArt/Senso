name: Retouch Studio hero wall v3

on:
  push:
    branches:
      - alex-revenue-sprint-01
    paths:
      - ".github/workflows/retouch-studio-hero-v3.yml"

permissions:
  contents: write

jobs:
  retouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alex-revenue-sprint-01

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check opencv-python-headless

      - name: Smooth only the right wall surface
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from pathlib import Path

          src=Path("Senso_Studio_Foto/studio-815.jpg")
          dst=Path("Senso_Studio_Foto/studio-815-retouched-v3.jpg")
          img=cv2.imread(str(src))
          if img is None:
              raise SystemExit("Could not read hero image")

          h,w=img.shape[:2]

          # Create a mask that follows the right wall only, excluding the ceiling,
          # table/pedestal and all other parts of the photograph.
          mask=np.zeros((h,w),np.uint8)
          pts=np.array([
              [int(w*0.64), int(h*0.17)],
              [int(w*0.78), int(h*0.105)],
              [int(w*0.90), int(h*0.045)],
              [w-2, 2],
              [w-2, int(h*0.61)],
              [int(w*0.64), int(h*0.61)]
          ],np.int32)
          cv2.fillPoly(mask,[pts],255)

          # Smooth just the high-frequency wall imperfections while keeping
          # the original broad light gradient and colour.
          smooth=cv2.GaussianBlur(img,(0,0),sigmaX=24,sigmaY=24)

          # Feather the intervention heavily so there is no visible retouch edge.
          feather=cv2.GaussianBlur(mask,(0,0),sigmaX=38,sigmaY=38).astype(np.float32)/255.0
          feather=(feather*0.82)[...,None]

          out=(img.astype(np.float32)*(1-feather)+smooth.astype(np.float32)*feather)

          # Tiny localized lift in the upper-right wall only, to remove the
          # residual shadow point without changing the global tonality.
          yy,xx=np.mgrid[0:h,0:w]
          cx,cy=w*0.91,h*0.16
          rx,ry=w*0.15,h*0.16
          local=np.exp(-(((xx-cx)/rx)**2+((yy-cy)/ry)**2)*2.5)
          local*= (mask.astype(np.float32)/255.0)
          lift=(local*4.0)[...,None]  # max +4/255: deliberately subtle
          out=np.clip(out+lift,0,255).astype(np.uint8)

          cv2.imwrite(str(dst),out,[int(cv2.IMWRITE_JPEG_QUALITY),97])
          print("candidate",dst,out.shape)
          PY

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Senso_Studio_Foto/studio-815-retouched-v3.jpg
          git commit -m "Create polished Studio hero wall candidate"
          git push origin HEAD:alex-revenue-sprint-01
