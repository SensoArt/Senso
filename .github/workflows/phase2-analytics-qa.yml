name: Phase 2 analytics QA
on:
  push:
    branches:
      - phase2-analytics-foundation-20261005
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Static and browser QA
        run: |
          node --check senso-analytics.js
          python3 -m http.server 4173 >/tmp/senso-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const failures=[];
          const pages=fs.readdirSync('.').filter(x=>/\.html$/i.test(x)&&!/-extra-gold-preview\.html$/i.test(x));
          for(const p of pages){
            const h=fs.readFileSync(p,'utf8');
            const refs=(h.match(/senso-analytics\.js/g)||[]).length;
            if(refs!==1) failures.push(p+': analytics refs='+refs);
            if(/fbq\(/.test(h)) failures.push(p+': legacy fbq remains');
            if(/2442677362880993/.test(h)) failures.push(p+': legacy pixel id remains');
            if(/<script src="senso-analytics\.js" defer><\/script>\\n/.test(h)) failures.push(p+': literal \\n remains');
          }
          const browser=await chromium.launch({headless:true});
          for(const vp of [{name:'mobile',width:390,height:844},{name:'desktop',width:1280,height:800}]){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/studio.html?utm_source=linkedin&utm_medium=organic&utm_campaign=phase2test',{waitUntil:'networkidle'});
            if(await page.locator('#senso-consent').count()!==1) failures.push(vp.name+': consent banner missing');
            const dims=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));
            if(dims.sw>dims.cw+2) failures.push(vp.name+': consent causes horizontal overflow');
            const pre=await page.evaluate(()=>({
              consent:localStorage.getItem('senso_consent_v1'),
              gaScripts:[...document.scripts].filter(s=>/googletagmanager/.test(s.src)).length,
              metaScripts:[...document.scripts].filter(s=>/facebook\.net/.test(s.src)).length,
              attribution:sessionStorage.getItem('senso_attribution_v1'),
              hidden:Object.fromEntries([...document.querySelectorAll('form input[type=hidden]')].map(x=>[x.name,x.value]))
            }));
            if(pre.consent) failures.push(vp.name+': consent preselected unexpectedly');
            if(pre.gaScripts||pre.metaScripts) failures.push(vp.name+': third-party tags loaded before consent');
            const attr=JSON.parse(pre.attribution||'{}');
            if(attr.utm_source!=='linkedin'||attr.utm_campaign!=='phase2test') failures.push(vp.name+': UTM attribution missing');
            if(pre.hidden.senso_utm_source!=='linkedin'||pre.hidden.senso_business_area!=='studio') failures.push(vp.name+': form enrichment missing');
            await page.click('[data-sc="settings"]');
            await page.check('[data-sc-option="analytics"]');
            await page.uncheck('[data-sc-option="marketing"]');
            await page.click('[data-sc="save"]');
            const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('senso_consent_v1')));
            if(!saved.analytics||saved.marketing) failures.push(vp.name+': analytics-only consent failed');
            if(await page.locator('#senso-cookie-settings').count()!==1) failures.push(vp.name+': settings reopen button missing');
            await page.evaluate(()=>window.sensoTrack('qa_event',{qa:'yes'}));
            const dl=await page.evaluate(()=>window.dataLayer.map(x=>Array.isArray(x)?x:[...x||[]]).slice(-6));
            if(!JSON.stringify(dl).includes('qa_event')) failures.push(vp.name+': GA event command not queued after analytics consent');
            await page.click('#senso-cookie-settings');
            await page.click('[data-sc="reject"]');
            const rejected=await page.evaluate(()=>JSON.parse(localStorage.getItem('senso_consent_v1')));
            if(rejected.analytics||rejected.marketing) failures.push(vp.name+': reject all failed');
            if(errors.length) failures.push(...errors.map(e=>vp.name+': '+e));
            await context.close();
          }
          // Spanish copy
          const esCtx=await browser.newContext({viewport:{width:390,height:844}});
          const es=await esCtx.newPage();
          await es.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await es.evaluate(()=>{localStorage.setItem('senso_lang','es');localStorage.removeItem('senso_consent_v1')});
          await es.reload({waitUntil:'networkidle'});
          const copy=await es.locator('#senso-consent').innerText();
          const esState=await es.evaluate(()=>({stored:localStorage.getItem('senso_lang'),html:document.documentElement.lang,btnEs:document.querySelector('#btn-es')?.className}));
          if(!/Aceptar todo|Rechazar|Configurar/i.test(copy)) failures.push('Spanish consent copy missing '+JSON.stringify({copy,esState}));
          await esCtx.close();
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('PHASE2_ANALYTICS_QA_OK pages='+pages.length);
          JS
