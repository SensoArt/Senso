name: Retouch Studio hero candidate

on:
  push:
    branches:
      - alex-revenue-sprint-01
    paths:
      - ".github/workflows/retouch-studio-hero.yml"

permissions:
  contents: write

jobs:
  retouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alex-revenue-sprint-01

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check opencv-python-headless

      - name: Create conservative retouch candidate
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from pathlib import Path

          src=Path("Senso_Studio_Foto/studio-815.jpg")
          dst=Path("Senso_Studio_Foto/studio-815-retouched-v2.jpg")

          img=cv2.imread(str(src))
          if img is None:
              raise SystemExit("Could not read hero image")

          h,w=img.shape[:2]
          gray=cv2.cvtColor(img,cv2.COLOR_BGR2GRAY)

          # Surgical mask: only the visible blemish and vertical wall seam
          # in the far-right blank wall area. Coordinates are tied to the
          # source image dimensions and intentionally avoid furniture/table.
          mask=np.zeros((h,w),np.uint8)

          # Small dark blemish on upper-right wall.
          cv2.ellipse(
              mask,
              (int(w*0.925), int(h*0.315)),
              (max(10,int(w*0.012)), max(10,int(h*0.018))),
              0,0,360,255,-1
          )

          # Faint vertical seam on the same right wall.
          x=int(w*0.885)
          cv2.rectangle(
              mask,
              (x-max(2,int(w*0.0025)), int(h*0.16)),
              (x+max(2,int(w*0.0025)), int(h*0.57)),
              255,-1
          )

          # Feather/dilate just enough for seamless content-aware fill.
          mask=cv2.dilate(mask,cv2.getStructuringElement(cv2.MORPH_ELLIPSE,(7,7)),iterations=1)
          out=cv2.inpaint(img,mask,7,cv2.INPAINT_TELEA)

          # High-quality JPEG, preserving original dimensions.
          cv2.imwrite(str(dst),out,[int(cv2.IMWRITE_JPEG_QUALITY),96])
          print("candidate",dst, out.shape, "masked_px",int(np.count_nonzero(mask)))
          PY

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Senso_Studio_Foto/studio-815-retouched-v2.jpg
          git commit -m "Create refined Studio hero retouch candidate"
          git push origin HEAD:alex-revenue-sprint-01
