name: Apply Studio hero retouch

on:
  push:
    branches:
      - alex-revenue-sprint-01
    paths:
      - ".github/workflows/apply-studio-hero-retouch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alex-revenue-sprint-01

      - name: Apply approved retouch
        run: |
          cp Senso_Studio_Foto/studio-815-retouched-v3.jpg Senso_Studio_Foto/studio-815.jpg

      - name: Commit retouched hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Senso_Studio_Foto/studio-815.jpg
          git commit -m "Apply polished Studio hero image"
          git push origin HEAD:alex-revenue-sprint-01
