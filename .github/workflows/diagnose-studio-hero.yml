name: Diagnose Studio hero

on:
  push:
    branches:
      - alex-revenue-sprint-01
    paths:
      - ".github/workflows/diagnose-studio-hero.yml"

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alex-revenue-sprint-01

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCV
        run: python -m pip install --disable-pip-version-check opencv-python-headless

      - name: Crop right side
        run: |
          python - <<'PY'
          import cv2
          from pathlib import Path
          src=Path("Senso_Studio_Foto/studio-815.jpg")
          dst=Path("Senso_Studio_Foto/studio-815-right-crop.jpg")
          img=cv2.imread(str(src))
          h,w=img.shape[:2]
          crop=img[0:int(h*0.68),int(w*0.62):w]
          cv2.imwrite(str(dst),crop,[int(cv2.IMWRITE_JPEG_QUALITY),98])
          print(crop.shape)
          PY

      - name: Commit crop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Senso_Studio_Foto/studio-815-right-crop.jpg
          git commit -m "Add temporary Studio hero diagnostic crop"
          git push origin HEAD:alex-revenue-sprint-01
