<!DOCTYPE html> <html lang="en"> <head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Senso Studio</title>

<meta
    name="description"
    content="Senso Studio offers painting classes and creative art experiences for adults, children, teams and companies in Barcelona."
>

<link rel="icon" type="image/png" href="favicon.png?v=1000">

<style>

    @font-face {
        font-family: Futura;
        src: url('Fonts/futura light bt.ttf');
    }

    @font-face {
        font-family: Behind;
        src: url('Fonts/Behind-The-Nineties-Md-It.otf');
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #fff;
        color: #000;
        font-family: Futura, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    a {
        color: #000;
        text-decoration: none;
    }

    button,
    input,
    textarea {
        font: inherit;
    }

    .back-home,
    .lang {
        position: fixed;
        top: 25px;
        z-index: 10;
        font-size: .65rem;
        letter-spacing: 2px;
    }

    .back-home {
        left: 20px;
        text-transform: uppercase;
        opacity: .7;
    }

    .lang {
        right: 20px;
    }

    .lang button {
        border: 0;
        background: none;
        padding: 0 5px;
        cursor: pointer;
        font-size: .65rem;
        letter-spacing: 2px;
        opacity: .35;
    }

    .lang button.active {
        opacity: 1;
    }

    .container {
        width: min(1150px, calc(100% - 80px));
        margin: auto;
        padding: 145px 0 110px;
    }

    .title {
        margin: 0 0 110px;
        font-family: Behind, serif;
        font-size: 3rem;
        font-weight: 400;
        text-transform: lowercase;
    }

    .hero {
        display: grid;
        grid-template-columns: 1.2fr .8fr;
        gap: 100px;
        align-items: end;
        margin-bottom: 150px;
    }

    .hero-copy {
        max-width: 570px;
        font-size: 1.2rem;
        line-height: 1.8;
    }

    .hero-copy p {
        margin: 0 0 25px;
    }

    .hero-note {
        align-self: start;
        padding-top: 12px;
        font-size: .7rem;
        line-height: 1.7;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        opacity: .6;
    }

    .offer {
        display: grid;
        grid-template-columns: 1fr 1.6fr;
        gap: 90px;
        margin-bottom: 160px;
    }

    .offer-intro {
        font-size: .7rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: .65;
    }

    .option {
        margin-bottom: 65px;
        cursor: pointer;
    }

    .option-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .option h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .symbol {
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: 300;
        opacity: .65;
    }

    .option-sub {
        margin: 14px 0 0;
        font-size: .95rem;
        opacity: .6;
    }

    .content {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height .7s ease, opacity .5s ease;
    }

    .option.open .content {
        max-height: 500px;
        margin-top: 35px;
        opacity: 1;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 55px;
    }

    .block h3 {
        margin: 0 0 17px;
        font-size: .7rem;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .block p {
        margin: 0;
        font-size: .95rem;
        line-height: 1.8;
    }

    .statement {
        display: grid;
        grid-template-columns: .8fr 1.2fr;
        gap: 100px;
        margin-bottom: 170px;
    }

    .statement-title {
        font-family: Behind, serif;
        font-size: 1.8rem;
        text-transform: lowercase;
    }

    .statement-text {
        font-size: 1.15rem;
        line-height: 1.8;
    }

    .statement-text p {
        margin: 0 0 25px;
    }

    .teachers {
        margin-bottom: 160px;
    }

        margin: 0 0 75px;
        font-family: Behind, serif;
        font-size: 1.7rem;
        font-weight: 400;
        text-transform: lowercase;
    }

        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 80px;
        align-items: end;
        margin-bottom: 110px;
    }

    .teacher.lucia {
        grid-template-columns: 1fr 260px;
    }

    .teacher.lucia > div:first-child {
        order: 2;
    }

    .teacher-image,
    .placeholder {
        width: 260px;
        height: 325px;
        object-fit: cover;
    }

    .placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        font-size: .55rem;
        letter-spacing: 2px;
    }

    .teacher-info {
        max-width: 500px;
    }

    .teacher-name {
        margin: 0 0 13px;
        font-family: Behind, serif;
        font-size: 1.5rem;
        font-weight: 400;
    }

    .role {
        margin-bottom: 25px;
        font-size: .65rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .teacher-info p {
        margin: 0;
        font-size: .95rem;
        line-height: 1.8;
    }

    .contact {
        text-align: center;
        margin-top: 20px;
    }

    .contact-title {
        margin: 0 0 35px;
        font-family: Behind, serif;
        font-size: 1.7rem;
        font-weight: 400;
        text-transform: lowercase;
    }

    .contact-link {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        font-size: .65rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: .7;
    }

    .form {
        display: none;
        max-width: 600px;
        margin: 60px auto 0;
        text-align: left;
    }

    .form.open {
        display: block;
        animation: fade .5s;
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
    }

    .field {
        margin-bottom: 30px;
    }

    .field label {
        display: block;
        margin-bottom: 8px;
        font-size: .6rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: .6;
    }

    .field input,
    .field textarea {
        width: 100%;
        padding: 8px 0 11px;
        border: 0;
        border-bottom: 1px solid #000;
        outline: 0;
        background: none;
        font-size: 1rem;
    }

    .field textarea {
        height: 100px;
        resize: vertical;
    }

    .submit {
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
        font-size: .65rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        opacity: .7;
    }

    .thanks {
        display: none;
        max-width: 500px;
        margin: 60px auto 0;
        font-size: 1rem;
        line-height: 1.8;
    }

    .es {
        display: none;
    }

    @keyframes fade {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }

    @media (max-width: 700px) {

        .container {
            width: calc(100% - 40px);
            padding-top: 120px;
        }

        .title {
            font-size: 2.2rem;
            margin-bottom: 75px;
        }

        .hero,
        .offer,
        .statement {
            display: block;
            margin-bottom: 110px;
        }

        .hero-copy {
            font-size: 1.05rem;
            line-height: 1.75;
        }

        .hero-note {
            margin-top: 40px;
        }

        .offer-intro {
            margin-bottom: 55px;
        }

        .option {
            margin-bottom: 50px;
        }

            grid-template-columns: 1fr;
            gap: 40px;
        }

        .statement-title {
            margin-bottom: 35px;
            font-size: 1.5rem;
        }

        .statement-text {
            font-size: 1.05rem;
            line-height: 1.75;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 55px;
        }

        .teacher,
        .teacher.lucia {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 90px;
        }

        .teacher.lucia > div:first-child {
            order: 0;
        }

        .teacher-image,
        .placeholder {
            width: 190px;
            height: 238px;
        }

        .row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .contact {
            margin-top: 110px;
        }

        .contact-title {
            font-size: 1.5rem;
        }

    }
