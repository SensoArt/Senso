<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Senso - Exhibitions</title>

    <meta
        name="description"
        content="Exhibitions and curatorial projects by Senso, an independent contemporary art project based in Barcelona and working internationally."
    >

    <link
        rel="canonical"
        href="https://senso-art.com/exhibitions.html"
    >

    <meta property="og:site_name" content="Senso">

    <meta
        property="og:title"
        content="Senso - Exhibitions"
    >

    <meta
        property="og:description"
        content="Exhibitions and curatorial projects by Senso, an independent contemporary art project based in Barcelona and working internationally."
    >

    <meta
        property="og:url"
        content="https://senso-art.com/exhibitions.html"
    >

    <meta property="og:type" content="website">


    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon.png?v=1000"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="favicon.png?v=1000"
    >

    <link
        rel="apple-touch-icon"
        href="favicon.png?v=1000"
    >

    <meta name="theme-color" content="#ffffff">


    <style>

        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
            font-display: swap;
        }

        @font-face {
            font-family: 'BehindNineties';
            src: url('Fonts/Behind-The-Nineties-Md-It.otf') format('opentype');
            font-display: swap;
        }


        /* =========================
           FADE IN
        ========================= */

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }


        .delay-1 {
            animation-delay: 0.2s;
        }


        .delay-2 {
            animation-delay: 0.5s;
        }


        /* =========================
           BODY
        ========================= */

        html {
            height: -webkit-fill-available;
        }


        body {

            background-color: #fff;

            color: #000;

            margin: 0;

            padding: 0;

            font-family: 'FuturaLight', sans-serif;

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;

            min-height: 100vh;

            min-height: -webkit-fill-available;

        }


        /* =========================
           HOME
        ========================= */

        .back-home {

            position: fixed;

            top: 25px;

            left: 20px;

            text-decoration: none;

            color: #000;

            font-family: 'FuturaLight', sans-serif;

            text-transform: uppercase;

            font-size: 0.65rem;

            letter-spacing: 2px;

            opacity: 0.8;

            z-index: 1000;

            transition: opacity 0.3s;

        }


        .back-home:hover {
            opacity: 1;
        }


        /* =========================
           LANGUAGE SWITCH
        ========================= */

        .lang-switch {

            position: fixed;

            top: 25px;

            right: 20px;

            font-family: 'FuturaLight', sans-serif;

            font-size: 0.65rem;

            letter-spacing: 2px;

            z-index: 1000;

        }


        .lang-btn {

            background: none;

            border: none;

            color: #000;

            cursor: pointer;

            padding: 0 5px;

            opacity: 0.4;

            text-transform: uppercase;

            transition: opacity 0.3s;

            font-family: 'FuturaLight', sans-serif;

            font-size: 0.65rem;

            letter-spacing: 2px;

        }


        .lang-btn.active {
            opacity: 1;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            padding: 150px 20px 40px;

            max-width: 850px;

            margin: 0 auto;

            text-align: left;

        }


        h1 {

            font-family: 'BehindNineties', serif;

            font-size: clamp(2rem, 5vw, 3rem);

            text-transform: lowercase;

            margin: 0;

            font-weight: normal;

            color: #000;

        }


        /* =========================
           CONTENT
        ========================= */

        .content-container {

            max-width: 850px;

            margin: 0 auto;

            padding: 0 25px 160px;

            text-align: left;

        }


        .lang-content {

            display: block;

        }


        .lang-content.hidden {

            display: none !important;

        }


        /* =========================
           EXHIBITIONS
        ========================= */

        .exhibitions-list {

            width: 600px;

            max-width: 100%;

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            gap: 100px;

        }


        .exhibition {

            width: 100%;

            text-decoration: none;

            color: #000;

            display: block;

        }


        .image-container {

            width: 100%;

            overflow: hidden;

            background-color: rgba(0,0,0,0.05);

            margin-bottom: 20px;

        }


        .exhibition-image {

            width: 100%;

            display: block;

            aspect-ratio: 3 / 2;

            object-fit: cover;

            object-position: top;

            transition:
                transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);

        }


        .exhibition:hover .exhibition-image {

            transform: scale(1.015);

        }


        /* =========================
           EXHIBITION INFO
        ========================= */

        .exhibition-meta {

            padding: 0 2px;

            text-align: left;

        }


        .exhibition-title {

            font-family: 'FuturaLight', sans-serif;

            font-size: 1.1rem;

            font-weight: normal;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin: 0 0 6px 0;

        }


        .exhibition-date {

            font-family: 'FuturaLight', sans-serif;

            font-size: 0.8rem;

            opacity: 0.6;

            margin: 0;

            letter-spacing: 0.5px;

            text-transform: uppercase;

        }


        /* =========================
           UPCOMING EXHIBITION
        ========================= */

        .upcoming {

            opacity: 0.4;

            cursor: default;

        }


        .upcoming-image {

            width: 100%;

            aspect-ratio: 3 / 2;

            background: rgba(0,0,0,0.05);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 0.75rem;

            letter-spacing: 2px;

            color: #666;

            font-family: 'FuturaLight', sans-serif;

            text-transform: uppercase;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            header {

                padding-top: 120px;

            }


            h1 {

                font-size: 2.2rem;

            }


            .content-container {

                padding-bottom: 140px;

            }


            .exhibitions-list {

                width: 100%;

                gap: 70px;

            }


            .exhibition-image {

                aspect-ratio: 4 / 3;

            }


            .exhibition-title {

                font-size: 1rem;

            }


            .exhibition-date {

                font-size: 0.75rem;

            }

        }

    </style>

</head>


<body>


    <!-- HOME -->

    <a href="index.html" class="back-home">
        ← Home
    </a>


    <!-- LANGUAGE SWITCH -->

    <div class="lang-switch">

        <button
            onclick="setLang('en')"
            id="btn-en"
            class="lang-btn active"
        >
            EN
        </button>

        |

        <button
            onclick="setLang('es')"
            id="btn-es"
            class="lang-btn"
        >
            ES
        </button>

    </div>


    <!-- HEADER -->

    <header class="fade-in delay-1">

        <h1 id="page-title">
            exhibitions
        </h1>

    </header>


    <!-- CONTENT -->

    <main class="content-container fade-in delay-2">


        <!-- =========================
             ENGLISH
        ========================= -->

        <div id="lang-en" class="lang-content">

            <div class="exhibitions-list">


                <!-- PRINCIPIUM -->

                <a
                    href="principium.html"
                    class="exhibition"
                >

                    <div class="image-container">

                        <img
                            src="atg_principium.jpeg"
                            alt="Principium exhibition by Senso"
                            class="exhibition-image"
                        >

                    </div>


                    <div class="exhibition-meta">

                        <h2 class="exhibition-title">
                            Principium
                        </h2>

                        <p class="exhibition-date">
                            Chapter I - Barcelona, 2026
                        </p>

                    </div>

                </a>


                <!-- UPCOMING -->

                <div class="exhibition upcoming">

                    <div class="image-container">

                        <div class="upcoming-image">
                            Upcoming Exhibition
                        </div>

                    </div>


                    <div class="exhibition-meta">

                        <h2 class="exhibition-title">
                            To Be Announced
                        </h2>

                        <p class="exhibition-date">
                            Chapter II - 2026
                        </p>

                    </div>

                </div>


            </div>

        </div>


        <!-- =========================
             SPANISH
        ========================= -->

        <div id="lang-es" class="lang-content hidden">

            <div class="exhibitions-list">


                <!-- PRINCIPIUM -->

                <a
                    href="principium.html"
                    class="exhibition"
                >

                    <div class="image-container">

                        <img
                            src="atg_principium.jpeg"
                            alt="Exposición Principium de Senso"
                            class="exhibition-image"
                        >

                    </div>


                    <div class="exhibition-meta">

                        <h2 class="exhibition-title">
                            Principium
                        </h2>

                        <p class="exhibition-date">
                            Capítulo I - Barcelona, 2026
                        </p>

                    </div>

                </a>


                <!-- PRÓXIMA EXPOSICIÓN -->

                <div class="exhibition upcoming">

                    <div class="image-container">

                        <div class="upcoming-image">
                            Próxima exposición
                        </div>

                    </div>


                    <div class="exhibition-meta">

                        <h2 class="exhibition-title">
                            Por anunciar
                        </h2>

                        <p class="exhibition-date">
                            Capítulo II - 2026
                        </p>

                    </div>

                </div>


            </div>

        </div>


    </main>


    <script>

        function setLang(lang) {

            const enBox = document.getElementById('lang-en');

            const esBox = document.getElementById('lang-es');

            const btnEn = document.getElementById('btn-en');

            const btnEs = document.getElementById('btn-es');

            const pageTitle = document.getElementById('page-title');


            if (lang === 'es') {

                enBox.classList.add('hidden');

                esBox.classList.remove('hidden');

                btnEn.classList.remove('active');

                btnEs.classList.add('active');

                pageTitle.textContent = 'exposiciones';

                document.documentElement.lang = 'es';

            } else {

                esBox.classList.add('hidden');

                enBox.classList.remove('hidden');

                btnEs.classList.remove('active');

                btnEn.classList.add('active');

                pageTitle.textContent = 'exhibitions';

                document.documentElement.lang = 'en';

            }


            localStorage.setItem('senso_lang', lang);

        }


        document.addEventListener('DOMContentLoaded', () => {

            const savedLang =
                localStorage.getItem('senso_lang') || 'en';

            setLang(savedLang);

        });

    </script>


</body>
</html>
