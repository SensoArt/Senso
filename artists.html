<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSO - Artists</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        @font-face { 
            font-family: 'FuturaLight'; 
            src: url('Fonts/futura light bt.ttf') format('truetype'); 
            font-display: swap; 
        }
        @font-face { 
            font-family: 'BehindNineties'; 
            src: url('Fonts/Behind-The-Nineties-Md-It.otf') format('opentype'); 
            font-display: swap; 
        }

        /* ANIMAZIONE FADE IN */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.4s; }
        .delay-2 { animation-delay: 0.9s; }

        body { 
            background-color: #fff; 
            color: #000; 
            margin: 0; 
            padding: 0; 
            font-family: 'FuturaLight', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
            overflow-y: auto;
            width: 100%;
            min-height: 100vh;
        }

        /* SFONDO BIANCO FISSO */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-color: #fff;
        }

        .back-home { 
            position: fixed; 
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.7; 
            z-index: 1000; 
            transition: opacity 0.3s; 
        }
        .back-home:hover { opacity: 1; }
        
        .lang-switch { 
            position: fixed; 
            top: 25px; 
            right: 20px; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            z-index: 1000; 
        }
        .lang-btn { 
            background: none; 
            border: none; 
            color: #000; 
            cursor: pointer; 
            padding: 0 5px; 
            opacity: 0.3; 
            text-transform: uppercase; 
            font-family: inherit; 
            letter-spacing: inherit; 
            transition: opacity 0.3s; 
        }
        .lang-btn.active { opacity: 1; }

        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            padding: 150px 25px 0; 
        }

        /* Titolo elegante e ridotto */
        .section-title { 
            font-family: 'BehindNineties', serif; 
            font-size: clamp(2rem, 5vw, 3rem); 
            margin: 0 0 50px 0; 
            text-transform: lowercase; 
            font-weight: normal; 
        }

        /* GRIGLIA A 3 COLONNE */
        .artists-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 30px;
            row-gap: 50px;
            width: 100%;
        }

        /* Singola scheda artista cliccabile */
        .artist-block { 
            text-decoration: none !important;
            display: flex;
            flex-direction: column;
            color: #000 !important;
        }
        
        .img-container { 
            width: 100%; 
            overflow: hidden; 
            background-color: rgba(0,0,0,0.03); 
            margin-bottom: 15px;
        }

        /* Immagine di base in bianco e nero */
        .artist-img { 
            width: 100%; 
            display: block; 
            aspect-ratio: 3 / 2; 
            object-fit: cover; 
            filter: grayscale(1);
            transition: filter 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        /* Transizione a colori e zoom al passaggio del mouse */
        .artist-block:hover .artist-img { 
            filter: grayscale(0);
            transform: scale(1.02); 
        }

        /* Allineamenti personalizzati delle inquadrature */
        .img-raul { object-position: center 20%; }
        .img-davide { object-position: center center; }
        .img-catherine { object-position: center 75%; }
        .img-rafael { object-position: center 48%; }

        /* Meta dettagli sotto l'immagine */
        .artist-meta {
            padding: 0 2px;
            text-align: left;
        }

        .artist-name { 
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.75rem; 
            font-weight: normal; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin: 0; 
        }

        /* SPAZIATORE FINALE PER DARE RESPIRO ALLA PAGINA */
        .footer-spacer {
            height: 18vh;
            min-height: 140px;
            width: 100%;
        }

        /* RESPONSIVE */
        @media (max-width: 850px) {
            .artists-grid {
                grid-template-columns: repeat(2, 1fr);
                column-gap: 30px;
                row-gap: 40px;
            }
        }

        @media (max-width: 600px) {
            .container { padding-top: 120px; padding-left: 20px; padding-right: 20px; }
            .section-title { font-size: 2.2rem; margin-bottom: 40px; } 
            .artists-grid {
                grid-template-columns: 1fr; 
                row-gap: 35px;
            }
            .artist-name { font-size: 0.75rem; }
            .footer-spacer {
                min-height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="lang-switch">
        <button onclick="setLang('en')" id="btn-en" class="lang-btn active">EN</button> | 
        <button onclick="setLang('es')" id="btn-es" class="lang-btn">ES</button>
    </div>

    <main class="container">
        
        <header class="header-section fade-in delay-1">
            <h1 class="section-title" id="main-title">artists</h1>
        </header>

        <div class="artists-grid fade-in delay-2">

            <a href="raul-del-chano.html" class="artist-block">
                <div class="img-container">
                    <img src="fotos_artistas/raul_del_chano.jpg" alt="Raúl del Chano" class="artist-img img-raul">
                </div>
                <div class="artist-meta">
                    <h2 class="artist-name">Raúl del Chano</h2>
                </div>
            </a>

            <a href="lucia-cheves.html" class="artist-block">
                <div class="img-container">
                    <img src="fotos_artistas/lucia_cheves.jpg" alt="Lucía Cheves Dauber" class="artist-img">
                </div>
                <div class="artist-meta">
                    <h2 class="artist-name">Lucía Cheves Dauber</h2>
                </div>
            </a>

            <a href="carlotta-valentinis.html" class="artist-block">
                <div class="img-container">
                    <img src="fotos_artistas/carlotta_valentinis.jpg" alt="Carlotta Valentinis Queraltó" class="artist-img">
                </div>
                <div class="artist-meta">
                    <h2 class="artist-name">Carlotta Valentinis Queraltó</h2>
                </div>
            </a>

            <a href="davide-ciaramella.html" class="artist-block">
                <div class="img-container">
                    <img src="fotos_artistas/davide_ciaramella.jpg" alt="Davide Ciaramella" class="artist-img img-davide">
                </div>
                <div class="artist-meta">
                    <h2 class="artist-name">Davide Ciaramella</h2>
                </div>
            </a>

            <a href="davide-disena.html" class="artist-block">
                <div class="img-container">
                    <img src="fotos_artistas/davide_disena.jpg" alt="Davide Di Sena" class="artist-img">
                </div>
                <div class="artist-meta">
                    <h2 class="artist-name">Davide Di Sena</h2>
                </div>
            </a>

            <a href="catherine-parra.html" class="artist-block">
                <div class="img-container">
                    <img src="fotos_artistas/catherine_parra.jpg" alt="Catherine Parra" class="artist-img img-catherine">
                </div>
                <div class="artist-meta">
                    <h2 class="artist-name">Catherine Parra</h2>
                </div>
            </a>

            <a href="rafael-nuesi.html" class="artist-block">
                <div class="img-container">
                    <img src="fotos_artistas/rafael_nuesi.JPG" alt="Rafael Nuesi" class="artist-img img-rafael">
                </div>
                <div class="artist-meta">
                    <h2 class="artist-name">Rafael Nuesi</h2>
                </div>
            </a>

        </div>

        <div class="footer-spacer"></div>

    </main>

    <script>
        function setLang(lang) {
            const btnEn = document.getElementById('btn-en');
            const btnEs = document.getElementById('btn-es');
            const title = document.getElementById('main-title');

            if (lang === 'es') {
                btnEs.classList.add('active'); 
                btnEn.classList.remove('active');
                title.innerText = 'artistas';
            } else {
                btnEn.classList.add('active'); 
                btnEs.classList.remove('active');
                title.innerText = 'artists';
            }
        }
    </script>
</body>
</html>
