<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Valentina Bobbo | Senso</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>

        @font-face { 
            font-family: 'FuturaLight'; 
            src: url('Fonts/futura light bt.ttf') format('truetype'); 
            font-display: swap; 
        }

        @font-face { 
            font-family: 'BehindNineties'; 
            src: url('Fonts/Behind-The-Nineties-Md-It.otf') format('opentype'); 
            font-display: swap; 
        }

        /* ANIMAZIONE FADE IN */

        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }

            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .delay-1 { 
            animation-delay: 0.4s; 
        }

        .delay-2 { 
            animation-delay: 0.9s; 
        }

        body { 
            background-color: #fff; 
            color: #000; 
            margin: 0; 
            padding: 0; 
            font-family: 'FuturaLight', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
            overflow-y: auto;
            width: 100%;
            min-height: 100vh;
        }

        /* SFONDO BIANCO FISSO */

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-color: #fff;
        }

        /* NAVIGATION BACK */

        .back-home { 
            position: fixed; 
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.7; 
            z-index: 1000; 
            transition: opacity 0.3s; 
        }

        .back-home:hover { 
            opacity: 1; 
        }

        /* LANGUAGE SWITCH */

        .lang-switch { 
            position: fixed; 
            top: 25px; 
            right: 20px; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            z-index: 1000; 
        }

        .lang-btn { 
            background: none; 
            border: none; 
            color: #000; 
            cursor: pointer; 
            padding: 0 5px; 
            opacity: 0.35; 
            text-transform: uppercase; 
            font-family: inherit; 
            letter-spacing: inherit; 
            font-size: 0.65rem;
            transition: opacity 0.3s; 
        }

        .lang-btn.active { 
            opacity: 1; 
        }

        /* CONTENITORE */

        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            padding: 150px 25px 0; 
        }

        /* TITOLO ARTISTA */

        .artist-title { 
            font-family: 'BehindNineties', serif; 
            font-size: clamp(2rem, 5vw, 3.5rem); 
            margin: 0 0 40px 0; 
            text-transform: lowercase; 
            font-weight: normal; 
        }

        /* IMPOSTAZIONE SCHEDA ARTISTA */

        .artist-profile {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        .profile-img-container {
            width: 100%;
            overflow: hidden;
            background-color: rgba(0,0,0,0.03);
        }

        .profile-img {
            width: 100%;
            display: block;
            aspect-ratio: 3 / 2;
            object-fit: cover;
            filter: grayscale(1);
            transition: filter 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .profile-img:hover {
            filter: grayscale(0);
        }

        .artist-bio {
            font-family: 'FuturaLight', sans-serif;
            font-size: 1.05rem;
            line-height: 1.8;
            letter-spacing: 0.3px;
            text-align: left;
        }

        /* SPAZIATORE */

        .footer-spacer {
            height: 18vh;
            min-height: 140px;
            width: 100%;
        }

        /* RESPONSIVE */

        @media (max-width: 768px) {
            .artist-profile {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .container { 
                padding-top: 120px; 
                padding-left: 20px; 
                padding-right: 20px; 
            }
        }

    </style>

</head>
<body>

    <div class="bg-container"></div>

    <a href="artists.html" class="back-home" id="back-link">
        ← Artists
    </a>

    <div class="lang-switch">

        <button 
            onclick="setLang('en')" 
            id="btn-en" 
            class="lang-btn active"
        >
            EN
        </button> 

        | 

        <button 
            onclick="setLang('es')" 
            id="btn-es" 
            class="lang-btn"
        >
            ES
        </button>

    </div>

    <main class="container">

        <header class="header-section fade-in delay-1">
            <h1 class="artist-title">
                valentina bobbo
            </h1>
        </header>

        <section class="artist-profile fade-in delay-2">

            <div class="profile-img-container">
                <img 
                    src="fotos_artistas/valentina_bobbo.jpg" 
                    alt="Valentina Bobbo" 
                    class="profile-img"
                >
            </div>

            <div class="artist-bio">

                <div id="bio-en">
                    <p>Biography and statement of Valentina Bobbo in English...</p>
                </div>

                <div id="bio-es" style="display: none;">
                    <p>Biografía e información de Valentina Bobbo en español...</p>
                </div>

            </div>

        </section>

        <div class="footer-spacer"></div>

    </main>

    <script>

        function setLang(lang) {

            const btnEn = document.getElementById('btn-en');
            const btnEs = document.getElementById('btn-es');
            const backLink = document.getElementById('back-link');

            const bioEn = document.getElementById('bio-en');
            const bioEs = document.getElementById('bio-es');

            if (lang === 'es') {

                btnEs.classList.add('active'); 
                btnEn.classList.remove('active');

                backLink.innerText = '← Artistas';

                bioEn.style.display = 'none';
                bioEs.style.display = 'block';

                document.documentElement.lang = 'es';

            } else {

                btnEn.classList.add('active'); 
                btnEs.classList.remove('active');

                backLink.innerText = '← Artists';

                bioEs.style.display = 'none';
                bioEn.style.display = 'block';

                document.documentElement.lang = 'en';

            }

            localStorage.setItem('senso_lang', lang);

        }

        document.addEventListener('DOMContentLoaded', () => {

            const savedLang = localStorage.getItem('senso_lang') || 'en';
            setLang(savedLang);

        });

    </script>

</body>
</html>
