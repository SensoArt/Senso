<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Catalogue</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=1000">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: 'FuturaLight', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Navigazione Home */
        .back-home {
            position: fixed; 
            top: 25px; 
            left: 20px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            z-index: 1000;
            opacity: 0.4;
            transition: 0.3s;
        }
        .back-home:hover { opacity: 1; }

        /* Contenitore Principale */
        .catalogue-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 180px 20px 100px 20px;
        }

        .catalogue-intro {
            text-align: center;
            margin-bottom: 150px;
        }

        .catalogue-intro h1 {
            font-size: 0.7rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.4;
        }

        /* Struttura Opera Singola */
        .work-section {
            margin-bottom: 250px; /* Spazio immenso tra le opere per isolarle */
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0; /* Per l'effetto comparsa */
            transform: translateY(30px);
            transition: all 1s ease-out;
        }

        .work-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .image-container {
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
            background-color: #f9f9f9; /* Placeholder leggero */
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            /* Rimuoviamo ombre pesanti per restare minimali */
        }

        .info-container {
            text-align: center;
            max-width: 500px;
        }

        .title {
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            font-weight: 400;
        }

        .artist {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .details {
            font-size: 0.7rem;
            letter-spacing: 1px;
            line-height: 1.8;
            margin-bottom: 35px;
            opacity: 0.5;
            text-transform: uppercase;
        }

        .btn-inquire {
            display: inline-block;
            text-decoration: none;
            color: #000;
            border: 0.5px solid rgba(0,0,0,0.3);
            padding: 14px 40px;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .btn-inquire:hover {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }

        /* Footer / Fine Catalogo */
        .catalogue-footer {
            text-align: center;
            padding: 100px 0;
            opacity: 0.3;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .catalogue-wrapper { padding-top: 120px; }
            .work-section { margin-bottom: 150px; }
            .title { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">← Home</a>

    <div class="catalogue-wrapper">
        
        <header class="catalogue-intro">
            <h1>Principium — Available Works</h1>
        </header>

        <div class="work-section">
            <div class="image-container">
                <img src="Assets/Catalogue/work1.jpg" alt="Work 1">
            </div>
            <div class="info-container">
                <h2 class="title">Obscura I</h2>
                <p class="artist">Artist Name</p>
                <p class="details">
                    Oil on raw linen<br>
                    140 x 180 cm<br>
                    2026
                </p>
                <a href="mailto:info@senso.com?subject=Inquiry: Obscura I" class="btn-inquire">Request Details</a>
            </div>
        </div>

        <div class="work-section">
            <div class="image-container">
                <img src="Assets/Catalogue/work2.jpg" alt="Work 2">
            </div>
            <div class="info-container">
                <h2 class="title">Silent Matter</h2>
                <p class="artist">Artist Name</p>
                <p class="details">
                    Sculptural Cement and Iron<br>
                    60 x 60 x 90 cm<br>
                    2026
                </p>
                <a href="mailto:info@senso.com?subject=Inquiry: Silent Matter" class="btn-inquire">Request Details</a>
            </div>
        </div>

        <footer class="catalogue-footer">
            End of Collection
        </footer>

    </div>

    <script>
        // Semplice script per far apparire le opere mentre si scende
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.work-section').forEach(section => {
            observer.observe(section);
        });
    </script>

</body>
</html>
