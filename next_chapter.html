<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Next Chapter</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=1000">
    <meta name="theme-color" content="#000000">

    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        @font-face {
            font-family: 'BehindNineties';
            src: url('Fonts/Behind-The-Nineties-Md-It.otf') format('opentype');
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'FuturaLight', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        /* BACKGROUND SFUMATO E SCURITO */
        .bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-image {
            width: 100%; height: 100%;
            background: url('pexels-mathilde-11843706.jpg') no-repeat center center;
            background-size: cover;
            filter: blur(8px) brightness(0.35); /* Sfocatura e luminosità ridotta per leggibilità */
            transform: scale(1.1); /* Evita bordi bianchi causati dal blur */
        }

        .back-home {
            position: fixed; top: 25px; left: 20px;
            text-decoration: none; color: #fff;
            text-transform: uppercase; font-size: 0.65rem;
            letter-spacing: 2px; opacity: 0.5; transition: 0.3s;
            z-index: 1000;
        }
        .back-home:hover { opacity: 1; }

        .lang-switch {
            position: fixed; top: 25px; right: 20px;
            font-size: 0.65rem; z-index: 1000;
        }
        .lang-btn {
            background: none; border: none; color: #fff;
            cursor: pointer; padding: 0 5px; opacity: 0.3;
            text-transform: uppercase; transition: 0.3s;
        }
        .lang-btn.active { opacity: 1; }

        .container {
            max-width: 800px;
            padding: 40px;
            animation: fadeIn 2.5s ease-out forwards;
            z-index: 5;
        }

        h1 {
            font-family: 'BehindNineties', serif;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: normal;
            text-transform: none;
            margin-bottom: 25px;
            line-height: 1.2;
            opacity: 0.95;
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .breathing-text {
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.8rem;
            opacity: 0.7;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 70px;
        }

        .cta-link {
            text-decoration: none;
            color: #fff;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 8px;
            transition: all 0.3s ease;
        }

        .cta-link:hover {
            opacity: 1;
            border-bottom: 1px solid #fff;
        }

        .hidden { display: none; }

        .logo-bottom {
            width: 120px;
            opacity: 0.4;
            position: absolute;
            bottom: 50px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .breathing-text { letter-spacing: 3px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="bg-image"></div>
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="lang-switch">
        <button onclick="setLang('en')" id="btn-en" class="lang-btn active">EN</button> | 
        <button onclick="setLang('es')" id="btn-es" class="lang-btn">ES</button>
    </div>

    <div class="container">
        <div id="lang-en">
            <h1>Evolution is a sensory process.</h1>
            <p class="breathing-text">The next space is already breathing</p>
            <a href="contacts.html" class="cta-link">Click here for early access</a>
        </div>

        <div id="lang-es" class="hidden">
            <h1>La evolución es un proceso sensorial.</h1>
            <p class="breathing-text">El próximo espacio ya está respirando</p>
            <a href="contacts.html" class="cta-link">Clic aquí para acceso prioritario</a>
        </div>
    </div>

    <img src="senso_logo_blanco.png" alt="Senso Logo" class="logo-bottom">

    <script>
        function setLang(lang) {
            document.getElementById('lang-en').classList.toggle('hidden', lang !== 'en');
            document.getElementById('lang-es').classList.toggle('hidden', lang !== 'es');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-es').classList.toggle('active', lang === 'es');
        }
    </script>
</body>
</html>
