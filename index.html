    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=1000">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png?v=1000">

    <meta name="theme-color" content="#000000">
    
    <meta name="description" content="Independent art organization based in Barcelona. Exploring contemporary art expression through curated exhibitions and sensory experiences.">

    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'FuturaLight', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .logo-home {
            width: 350px; 
            max-width: 80%;
            margin-bottom: 50px;
            mix-blend-mode: screen; 
            filter: brightness(1.1);
        }

        nav {
            display: flex;
            gap: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 1;
        }

        @media (max-width: 600px) {
            nav { 
                flex-direction: column; 
                gap: 20px; 
            }
            .logo-home { 
                width: 280px; 
            }
        }
    </style>
