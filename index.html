<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Senso — Journal</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        @font-face { 
            font-family: 'FuturaLight'; 
            src: url('Fonts/futura light bt.ttf') format('truetype'); 
            font-display: swap; 
        }
        @font-face { 
            font-family: 'BehindNineties'; 
            src: url('Fonts/Behind-The-Nineties-Md-It.otf') format('opentype'); 
            font-display: swap; 
        }

        /* ANIMAZIONE FADE IN */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }

        body { 
            background-color: #fff; 
            color: #000; 
            margin: 0; 
            padding: 0; 
            font-family: 'FuturaLight', sans-serif; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }

        /* SFONDO BIANCO FISSO */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background-color: #fff;
        }

        /* Navigazione Superiore Minimalista */
        .back-home { 
            position: fixed; 
            top: 30px; 
            left: 30px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.6; 
            z-index: 1000; 
            transition: opacity 0.3s; 
        }
        .back-home:hover { opacity: 1; }
        
        .lang-switch { 
            position: fixed; 
            top: 30px; 
            right: 30px; 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            z-index: 1000; 
        }
        .lang-btn { 
            background: none; 
            border: none; 
            color: #000; 
            cursor: pointer; 
            padding: 0 5px; 
            opacity: 0.3; 
            text-transform: uppercase; 
            font-family: inherit; 
            letter-spacing: inherit; 
            transition: opacity 0.3s; 
        }
        .lang-btn.active { opacity: 1; }

        /* CONTENITORE PRINCIPALE (Allineamento e proporzioni dall'immagine di riferimento) */
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 160px 25px 120px; 
        }

        .journal-header {
            margin-bottom: 70px;
            text-align: left;
        }

        .journal-title { 
            font-family: 'Times New Roman', Times, serif; 
            font-size: clamp(2.5rem, 6vw, 3.8rem); 
            font-weight: normal;
            margin: 0; 
        }

        /* GRIGLIA DEGLI ARTICOLI (Solo 1 attivo per ora) */
        .journal-feed {
            display: flex;
            flex-direction: column;
        }

        .essay-card {
            border-bottom: 1px solid rgba(0, 0, 0, 0.12);
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            text-align: left;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        
        .essay-card:hover {
            opacity: 0.65;
        }

        .essay-number {
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            color: #000;
        }

        .essay-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: clamp(1.5rem, 3.8vw, 2.2rem);
            font-weight: normal;
            margin: 0 0 15px 0;
            line-height: 1.25;
            letter-spacing: 0.2px;
            color: #000;
        }

        .essay-subtype {
            font-family: 'BehindNineties', serif;
            font-size: 1.05rem;
            color: #000;
            opacity: 0.85;
            margin: 0;
        }

        /* LETTORE IMMERSIVO DI ARTICOLI (OVERLAY) */
        .reader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            z-index: 2000;
            display: flex;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            overflow-y: auto;
        }

        .reader-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .reader-container {
            max-width: 720px;
            width: 100%;
            padding: 140px 25px 150px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reader-overlay.active .reader-container {
            transform: translateY(0);
        }

        .reader-close {
            position: fixed;
            top: 30px;
            left: 30px;
            background: none;
            border: none;
            color: #000;
            font-family: 'FuturaLight', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
            z-index: 2010;
        }

        .reader-close:hover {
            opacity: 1;
        }

        /* TIPOGRAFIA INTERNA AL LETTORE */
        .reader-number {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-bottom: 15px;
        }

        .reader-essay-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: clamp(1.8rem, 4.5vw, 2.8rem);
            font-weight: normal;
            line-height: 1.25;
            margin: 0 0 15px 0;
        }

        .reader-meta-line {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.4;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 25px;
            margin-bottom: 45px;
        }

        .reader-body p {
            font-size: 1.05rem;
            line-height: 2;
            opacity: 0.85;
            margin-bottom: 30px;
            text-align: justify;
        }

        .reader-body .important-quote {
            font-family: 'BehindNineties', serif;
            font-size: clamp(1.3rem, 3.5vw, 1.7rem);
            line-height: 1.6;
            color: #000;
            opacity: 1;
            margin: 45px 0;
            padding: 0 25px;
            border-left: 2px solid #000;
            text-align: left;
        }

        .hidden { display: none; }

        /* RESPONSIVE */
        @media (max-width: 800px) {
            .container { padding-top: 120px; }
            .reader-container { padding-top: 100px; }
            .reader-close { top: 25px; left: 20px; }
            .back-home { top: 25px; left: 20px; }
            .lang-switch { top: 25px; right: 20px; }
        }
    </style>
</head>
<body>

    <!-- Sfondo Bianco -->
    <div class="bg-container"></div>

    <!-- Navigazione Elegante -->
    <a href="index.html" class="back-home">← Home</a>

    <!-- Selettore di Lingua (EN | ES | IT) -->
    <div class="lang-switch">
        <button onclick="setLang('en')" id="btn-en" class="lang-btn active">EN</button> | 
        <button onclick="setLang('es')" id="btn-es" class="lang-btn">ES</button> |
        <button onclick="setLang('it')" id="btn-it" class="lang-btn">IT</button>
    </div>

    <!-- LETTORE IMMERSIVO DI ARTICOLI (OVERLAY) -->
    <div class="reader-overlay" id="essay-reader">
        <button class="reader-close" id="reader-close">close</button>
        <div class="reader-container">
            <div class="reader-number" id="reader-num-text">Journal 001</div>
            <h1 class="reader-essay-title" id="reader-title-text">Title</h1>
            <div class="reader-meta-line" id="reader-meta-text">By...</div>
            <article class="reader-body" id="reader-body-content">
                <!-- Popolato via JS -->
            </article>
        </div>
    </div>

    <!-- CONTENUTORE PRINCIPALE FEED -->
    <div class="container">
        
        <header class="journal-header fade-in delay-1">
            <h1 class="journal-title">Journal</h1>
        </header>

        <!-- Il Feed degli articoli con solo il primo articolo attivo -->
        <main class="journal-feed fade-in delay-2" id="feed-container">
            <!-- Popolato dinamicamente via JS -->
        </main>
    </div>

    <script>
        // --- DATABASE SAGGI (EN / ES / IT) ---
        const essaysDatabase = [
            {
                number: "Journal 001",
                
                // ENGLISH
                titleEn: "On Opening an Independent Gallery",
                subtypeEn: "Essay · July 2026",
                authorEn: "Claudia Alizieri & Adrian Villanueva",
                contentEn: `
                    <p>Opening an independent gallery is an act of defiance, a gesture of belief in the slow, tactile experience of art. In an era dominated by instantaneous digital circulation, we chose to anchor ourselves in the physical presence of matter, in the quiet gravity of spaces where thoughts can settle.</p>
                    <div class="important-quote">“To open a space is not to build walls, but to offer a clear horizon where artists and observers can meet in silent dialogue.”</div>
                    <p>SENSO was born from an intuitive urge to cultivate something raw and authentic. It is an exploration of the boundaries where raw material, conceptual design, and sensory experience converge. Through Chapter I: Principium, we trace back to the roots of creative impulse—embracing chaos as the primordial soil from which all form arises.</p>
                `,

                // SPANISH
                titleEs: "Sobre la apertura de una galería independiente",
                subtypeEs: "Ensayo · Julio 2026",
                authorEs: "Claudia Alizieri y Adrian Villanueva",
                contentEs: `
                    <p>Abrir una galería independiente es un acto de desafío, un gesto de fe en la experiencia lenta y táctil del arte. En una era dominada por la circulación digital instantánea, elegimos anclarnos en la presencia física de la materia, en la gravedad silenciosa de espacios donde los pensamientos pueden asentarse.</p>
                    <div class="important-quote">“Abrir un espacio no es construir muros, sino ofrecer un horizonte despejado donde artistas y observadores puedan encontrarse en un diálogo silencioso.”</div>
                    <p>SENSO nació del deseo intuitivo de cultivar algo puro y auténtico. Es una exploración de los límites donde convergen la materia prima, el diseño conceptual y la experiencia sensorial. A través del Capítulo I: Principium, rastreamos las raíces del impulso creativo, abrazando el caos como el suelo primordial del que surge toda forma.</p>
                `,

                // ITALIANO
                titleIt: "Sull'apertura di una galleria indipendente",
                subtypeIt: "Saggio · Luglio 2026",
                authorIt: "Claudia Alizieri e Adrian Villanueva",
                contentIt: `
                    <p>Aprire una galleria indipendente è un atto di sfida, un gesto di fiducia nell'esperienza lenta e tattile dell'arte. In un'era dominata dalla circolazione digitale istantanea, abbiamo scelto di ancorarci alla presenza fisica della materia, alla silenziosa gravità di spazi dove i pensieri possono posarsi.</p>
                    <div class="important-quote">“Aprire uno spazio non significa costruire muri, ma offrire un orizzonte libero dove artisti e osservatori possano incontrarsi in un dialogo silenzioso.”</div>
                    <p>SENSO nasce da un impulso intuitivo, dal desiderio di coltivare qualcosa di puro e autentico. È un'esplorazione dei confini in cui materia prima, design concettuale ed esperienza sensoriale convergono. Attraverso il Capitolo I: Principium, rintracciamo le radici dell'impulso creativo, abbracciando il caos come il terreno primordiale da cui sorge ogni forma.</p>
                `
            }
        ];

        // --- TRADUZIONI DI INTERFACCIA ---
        const uiTranslations = {
            en: {
                close: "close",
                by: "By"
            },
            es: {
                close: "cerrar",
                by: "Escrito por"
            },
            it: {
                close: "chiudi",
                by: "Scritto da"
            }
        };

        // Lingua attiva di default
        let currentLang = 'en';

        // --- GESTIONE COSTRUZIONE INTERFACCIA ---
        const feedContainer = document.getElementById('feed-container');
        const essayReader = document.getElementById('essay-reader');
        const readerClose = document.getElementById('reader-close');
        
        const readerNumText = document.getElementById('reader-num-text');
        const readerCatText = document.getElementById('reader-cat-text');
        const readerTitleText = document.getElementById('reader-title-text');
        const readerMetaText = document.getElementById('reader-meta-text');
        const readerBodyContent = document.getElementById('reader-body-content');

        function renderFeed() {
            feedContainer.innerHTML = '';

            // Genera le card degli articoli presenti nel database
            essaysDatabase.forEach((essay, index) => {
                const card = document.createElement('div');
                card.className = 'essay-card';
                card.setAttribute('onclick', `openEssay(${index})`);

                const title = getLangValue(essay, 'title');
                const subtype = getLangValue(essay, 'subtype');

                card.innerHTML = `
                    <span class="essay-number">${essay.number}</span>
                    <h2 class="essay-title">${title}</h2>
                    <span class="essay-subtype">${subtype}</span>
                `;
                feedContainer.appendChild(card);
            });
        }

        // Helper per estrarre la proprietà corretta in base alla lingua
        function getLangValue(obj, key) {
            const capitalizedLang = currentLang.charAt(0).toUpperCase() + currentLang.slice(1);
            return obj[key + capitalizedLang] || obj[key + 'En'] || '';
        }

        // --- LETTORE IMMERSIVO ---
        function openEssay(index) {
            const essay = essaysDatabase[index];
            if (!essay) return;

            const title = getLangValue(essay, 'title');
            const subtype = getLangValue(essay, 'subtype');
            const author = getLangValue(essay, 'author');
            const content = getLangValue(essay, 'content');

            // Imposta i contenuti nel lettore overlay
            readerNumText.innerText = essay.number;
            readerTitleText.innerText = title;
            readerMetaText.innerText = `${uiTranslations[currentLang].by} ${author} — ${subtype}`;
            readerBodyContent.innerHTML = content;

            // Mostra l'overlay e disabilita lo scroll della pagina sottostante
            essayReader.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeEssay() {
            essayReader.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                readerBodyContent.innerHTML = '';
            }, 400);
        }

        readerClose.addEventListener('click', closeEssay);
        
        essayReader.addEventListener('click', (e) => {
            if (e.target === essayReader) {
                closeEssay();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && essayReader.classList.contains('active')) {
                closeEssay();
            }
        });

        // --- SELEZIONE LINGUA ---
        function setLang(lang) {
            currentLang = lang;
            
            // Aggiorna lo stato visivo dei pulsanti switcher
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn-${lang}`).classList.add('active');

            // Traduce gli elementi strutturali dell'interfaccia
            readerClose.innerText = uiTranslations[lang].close;

            // Rigenera il feed con la nuova lingua selezionata
            renderFeed();

            // Se l'overlay del lettore è attualmente aperto, aggiornalo al volo
            if (essayReader.classList.contains('active')) {
                openEssay(0); // Aggiorna l'unico articolo aperto
            }
        }

        // Avvio automatico al caricamento della pagina
        window.onload = function() {
            renderFeed();
        }
    </script>
</body>
</html>
