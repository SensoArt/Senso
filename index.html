<style>

@font-face {
    font-family: 'FuturaLight';
    src: url('Fonts/futura light bt.ttf') format('truetype');
}

body {
    background-color: #000;
    color: #fff;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: 'FuturaLight', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}

.logo-home {
    width: 350px;
    max-width: 80%;
    margin-bottom: 50px;
    mix-blend-mode: screen;
    filter: brightness(1.1);
}

.lang-switch {
    position: fixed;
    top: 25px;
    right: 20px;
    z-index: 1000;
    font-size: 0.65rem;
    letter-spacing: 2px;
}

.lang-btn {
    padding: 0 5px;
    border: 0;
    background: none;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.65rem;
    letter-spacing: 2px;
    opacity: 0.35;
}

.lang-btn.active {
    opacity: 1;
}

nav {
    display: flex;
    gap: 30px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 0.9rem;
}

nav a {
    color: #fff;
    text-decoration: none;
    opacity: 0.6;
    transition: opacity 0.3s;
}

nav a:hover {
    opacity: 1;
}

.hidden {
    display: none;
}

@media (max-width: 600px) {

    nav {
        flex-direction: column;
        gap: 20px;
    }

    .logo-home {
        width: 280px;
    }

}

</style>

</head>

<body>

<img
src="senso_logo_blanco.png"
alt="Senso Logo"
class="logo-home"
>

<div class="lang-switch">

    <button
        id="btn-en"
        class="lang-btn active"
        onclick="setLang('en')"
    >
        EN
    </button>

    |

    <button
        id="btn-es"
        class="lang-btn"
        onclick="setLang('es')"
    >
        ES
    </button>

</div>

<nav id="nav-en">

    <a href="about.html">About</a>

    <a href="exhibitions.html">Exhibitions</a>

    <a href="artists.html">Artists</a>

    <a href="art-consulting.html">Art Consulting</a>

    <a href="studio.html">Senso Studio</a>

    <a href="journal.html">Journal</a>

    <a href="contacts.html">Contacts</a>

</nav>

<nav id="nav-es" class="hidden">

    <a href="about.html">Quiénes somos</a>

    <a href="exhibitions.html">Exposiciones</a>

    <a href="artists.html">Artistas</a>

    <a href="art-consulting.html">Asesoría de Arte</a>

    <a href="studio.html">Senso Studio</a>

    <a href="journal.html">Journal</a>

    <a href="contacts.html">Contacto</a>

</nav>

<script>

function setLang(lang) {

    const isSpanish = lang === 'es';

    document
        .getElementById('nav-en')
        .classList
        .toggle('hidden', isSpanish);

    document
        .getElementById('nav-es')
        .classList
        .toggle('hidden', !isSpanish);

    document
        .getElementById('btn-en')
        .classList
        .toggle('active', !isSpanish);

    document
        .getElementById('btn-es')
        .classList
        .toggle('active', isSpanish);

    document.documentElement.lang = lang;

    localStorage.setItem('senso_lang', lang);
}

document.addEventListener('DOMContentLoaded', function() {

    const savedLang =
        localStorage.getItem('senso_lang') || 'en';

    setLang(savedLang);

});

</script>

</body>
