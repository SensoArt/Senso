<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senso — Archive</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=99">
    
    <style>
        @font-face {
            font-family: 'FuturaLight';
            src: url('Fonts/futura light bt.ttf') format('truetype');
        }

        body {
            margin: 0; background-color: #000; color: #fff;
            font-family: 'FuturaLight', sans-serif; overflow: hidden;
        }

        .archive-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
        }

        .archive-bg img {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 1; 
            display: block;
        }
        
        .back-home {
            position: absolute; 
            top: 25px; 
            left: 50px; 
            text-decoration: none; 
            color: #000; 
            text-transform: uppercase;
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            opacity: 0.8;
            z-index: 10;
        }

        .archive-content {
            position: absolute; 
            top: 140px; 
            left: 75px; 
            text-align: left;
            z-index: 5;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-item {
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeInText 1.2s ease-out forwards;
        }

        /* Ritardi incrementali per ogni voce */
        .menu-item:nth-child(1) { animation-delay: 0.4s; }
        .menu-item:nth-child(2) { animation-delay: 0.5s; }
        .menu-item:nth-child(3) { animation-delay: 0.6s; }
        .menu-item:nth-child(4) { animation-delay: 0.7s; }
        .menu-item:nth-child(5) { animation-delay: 0.8s; }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-link { 
            text-decoration: none; 
            font-size: 1.5rem; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            color: #1a1a1a; /* Testo scuro richiesto */
            display: inline-block;
            transition: opacity 0.3s;
        }

        .menu-link:hover {
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            .back-home { left: 20px; }
            .archive-content { left: 30px; top: 120px; }
            .menu-link { font-size: 1.2rem; letter-spacing: 4px; }
            .menu-item { margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="archive-bg">
        <img src="archive_background_final.jpg" alt="">
    </div>

    <a href="index.html" class="back-home">← Home</a>

    <div class="archive-content">
        <nav>
            <ul class="menu-list">
                <li class="menu-item"><a href="about.html" class="menu-link">About</a></li>
                <li class="menu-item"><a href="archive_list.html" class="menu-link">Archive</a></li>
                <li class="menu-item"><a href="next_chapter.html" class="menu-link">Next Chapter</a></li>
                <li class="menu-item"><a href="artists.html" class="menu-link">Artists</a></li>
                <li class="menu-item"><a href="contacts.html" class="menu-link">Contacts</a></li>
            </ul>
        </nav>
    </div>

</body>
</html>
