<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senso | Contemporary Art Expression</title>
<meta name="description" content="RESonance exhibition catalogue by Senso.">
<link rel="icon" type="image/png" href="/favicon.png?v=1000">
<meta name="theme-color" content="#ffffff">
<style>
@font-face{font-family:FuturaLight;src:url('/Fonts/futura light bt.ttf') format('truetype');font-display:swap}
@font-face{font-family:GilroyExtraBold;src:url('/Fonts/Gilroy-ExtraBold.otf') format('opentype');font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#111}
body{font-family:FuturaLight,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{min-height:100svh;display:flex;flex-direction:column;padding:28px 28px 26px}
.back{align-self:flex-start;color:#111;text-decoration:none;text-transform:uppercase;font-size:.62rem;letter-spacing:2px;padding:8px 0}
main{width:100%;max-width:1100px;margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 0 90px}
h1{font-family:GilroyExtraBold,Arial,sans-serif;font-size:clamp(3.4rem,9vw,7.2rem);line-height:.9;margin:0;letter-spacing:-.035em}
.subtitle{margin:26px 0 64px;font-size:.7rem;text-transform:uppercase;letter-spacing:2.4px}
.languages{display:flex;align-items:center;justify-content:center;gap:46px}
.languages a{color:#111;text-decoration:none;font-size:.76rem;letter-spacing:2.2px;text-transform:uppercase;padding:12px 0;border-bottom:1px solid transparent;transition:border-color .2s ease}
.languages a:hover,.languages a:focus-visible{border-color:#111;outline:none}
footer{margin-top:auto;text-align:center;font-size:.58rem;letter-spacing:1.7px;text-transform:uppercase;padding-top:20px}
@media(max-width:600px){
  .page{padding:22px 20px 24px}
  main{padding:50px 0 75px}
  h1{font-size:clamp(3.4rem,18vw,5.8rem)}
  .subtitle{margin:24px 0 52px;font-size:.64rem}
  .languages{gap:28px}
  .languages a{font-size:.7rem;min-height:44px;display:flex;align-items:center}
}
</style>
</head>
<body>
<div class="page">
<a class="back" href="/resonance.html">← RESonance</a>
<main>
<h1>RESonance</h1>
<p class="subtitle">Exhibition catalogue</p>
<nav class="languages" aria-label="Catalogue language">
<a href="/resonance-catalogue-en.pdf">English →</a>
</nav>
</main>
<footer>Senso · Contemporary Art Expression</footer>
</div>
</body>
</html>
