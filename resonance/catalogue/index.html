@font-face{font-family:FuturaLight;src:url('../../Fonts/futura light bt.ttf') format('truetype');font-display:swap}
@font-face{font-family:BehindTheNineties;src:url('../../Fonts/Behind-The-Nineties-Md-It.otf') format('opentype');font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#111}
body{font-family:FuturaLight,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.catalogue-page{min-height:100svh;display:flex;flex-direction:column;padding:28px 28px 26px}

.languages{display:flex;align-items:center;justify-content:center;gap:52px}
.languages a{color:#111;text-decoration:none;font-size:.76rem;letter-spacing:2.4px;text-transform:uppercase;padding:10px 0;border-bottom:1px solid transparent;transition:border-color .2s ease,opacity .2s ease}
.languages a:hover,.languages a:focus-visible{border-color:#111;outline:none}
footer{margin-top:auto;display:flex;justify-content:center;text-align:center;font-size:.58rem;letter-spacing:1.8px;text-transform:uppercase;padding-top:20px}
@media(max-width:600px){
  .catalogue-page{padding:22px 20px 24px}
  main{padding:50px 0 75px}
  h1{font-size:clamp(3.8rem,20vw,6.6rem)}
